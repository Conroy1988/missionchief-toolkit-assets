name: Release Toolkit

on:
  workflow_call:
    inputs:
      version:
        description: "Validated Toolkit version to publish"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE to confirm a public release"
        required: true
        type: string
      validation_run_id:
        description: "Exact successful canonical-validation workflow run ID"
        required: false
        default: ""
        type: string
      validated_sha:
        description: "Exact validated main commit SHA"
        required: false
        default: ""
        type: string
      pull_request_number:
        description: "Associated merged pull request number for telemetry"
        required: false
        default: ""
        type: string
      pr_created_at:
        description: "Associated pull request creation timestamp"
        required: false
        default: ""
        type: string
      pr_merged_at:
        description: "Associated pull request merge timestamp"
        required: false
        default: ""
        type: string
      implementation_ready_at:
        description: "Final candidate commit timestamp"
        required: false
        default: ""
        type: string
      validation_completed_at:
        description: "Exact successful PR validation completion timestamp"
        required: false
        default: ""
        type: string
    secrets:
      DISCORD_RELEASE_WEBHOOK:
        required: true
      MIGRATION_REPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Validated Toolkit version to publish"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE to confirm a public release"
        required: true
        type: string
      validation_run_id:
        description: "Optional canonical-validation workflow run ID"
        required: false
        default: ""
        type: string
      validated_sha:
        description: "Optional exact validated main commit SHA"
        required: false
        default: ""
        type: string
      pull_request_number:
        description: "Optional associated merged pull request number"
        required: false
        default: ""
        type: string
      pr_created_at:
        description: "Optional pull request creation timestamp"
        required: false
        default: ""
        type: string
      pr_merged_at:
        description: "Optional pull request merge timestamp"
        required: false
        default: ""
        type: string
      implementation_ready_at:
        description: "Optional final candidate commit timestamp"
        required: false
        default: ""
        type: string
      validation_completed_at:
        description: "Optional exact validation completion timestamp"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: toolkit-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, publish, back up and verify Toolkit release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out latest main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.validated_sha != '' && inputs.validated_sha || 'main' }}
          fetch-depth: 0

      - name: Production release safety gate
        id: release_start
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          VALIDATED_SHA: ${{ inputs.validated_sha }}
          GH_TOKEN: ${{ github.token }}
          MIGRATION_REPO_TOKEN: ${{ secrets.MIGRATION_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [[ "$CONFIRMATION" == "RELEASE" ]] || { echo "::error::Type RELEASE exactly to confirm."; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid release version: $RELEASE_VERSION"; exit 1; }
          [[ "$(jq -r '.distributionAuthority' .github/release-settings.json)" == "tkb-website-only" ]] || { echo "::error::TKB Website must remain the sole distribution authority."; exit 1; }
          [[ -n "${MIGRATION_REPO_TOKEN:-}" ]] || { echo "::error::MIGRATION_REPO_TOKEN is not configured."; exit 1; }
          if [[ -n "$VALIDATED_SHA" ]]; then
            git fetch origin main --prune
            [[ "$(git rev-parse origin/main)" == "$VALIDATED_SHA" ]]
            [[ "$(git rev-parse HEAD)" == "$VALIDATED_SHA" ]]
          fi
          gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1 && { echo "::error::GitHub Release v${RELEASE_VERSION} already exists."; exit 1; } || true

      - name: Resolve exact immutable release candidate
        id: candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          VALIDATED_SHA: ${{ inputs.validated_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$VALIDATION_RUN_ID" && -n "$VALIDATED_SHA" ]]; then
            ARTIFACT_NAME="missionchief-toolkit-validation-candidate-${VALIDATED_SHA}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}/artifacts" > /tmp/validation-artifacts.json
            ARTIFACT_ID="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts | map(select(.name == $name and .expired == false)) | sort_by(.created_at) | last | .id // empty' /tmp/validation-artifacts.json)"
            [[ -n "$ARTIFACT_ID" ]] || { echo "::error::Exact validation candidate artifact was not found."; exit 1; }
            rm -rf /tmp/validation-candidate
            mkdir -p /tmp/validation-candidate
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/validation-candidate.zip
            unzip -q /tmp/validation-candidate.zip -d /tmp/validation-candidate
            EVIDENCE="/tmp/validation-candidate/validation-candidate/validation-candidate.json"
            CANDIDATE_DIST="/tmp/validation-candidate/dist"
            CANDIDATE_BUNDLE="/tmp/validation-candidate/release-bundle"
            python3 .github/scripts/verify_validation_candidate.py --evidence "$EVIDENCE" --source src/MissionChief_Map_Command_Toolkit.user.js --dist-dir "$CANDIDATE_DIST" --expected-commit "$VALIDATED_SHA" --expected-ref refs/heads/main --expected-version "$RELEASE_VERSION"
            test -d "$CANDIDATE_BUNDLE"
            rm -rf dist release-bundle
            cp -a "$CANDIDATE_DIST" dist
            cp -a "$CANDIDATE_BUNDLE" release-bundle
            echo "mode=immutable-candidate" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/validate_userscript.py
            node --check src/MissionChief_Map_Command_Toolkit.user.js
            cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
            python3 .github/scripts/prepare_release_bundle.py "$RELEASE_VERSION"
            echo "mode=manual-recovery" >> "$GITHUB_OUTPUT"
          fi
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          test "$(jq -r '.version' dist/release-manifest.json)" = "$RELEASE_VERSION"

      - name: Prepare stable first-party release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cp "release-bundle/MissionChief_Map_Command_Toolkit_v${RELEASE_VERSION}.user.js" \
             "release-bundle/MissionChief_Map_Command_Toolkit.user.js"
          cp "release-bundle/MissionChief_Map_Command_Toolkit_v${RELEASE_VERSION}.txt" \
             "release-bundle/MissionChief_Map_Command_Toolkit.txt"
          cmp --silent \
             "release-bundle/MissionChief_Map_Command_Toolkit.user.js" \
             "release-bundle/MissionChief_Map_Command_Toolkit.txt"

      - name: Verify release bundle integrity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          USER_FILE="release-bundle/MissionChief_Map_Command_Toolkit_v${RELEASE_VERSION}.user.js"
          TXT_FILE="release-bundle/MissionChief_Map_Command_Toolkit_v${RELEASE_VERSION}.txt"
          MANIFEST="release-bundle/release-manifest-v${RELEASE_VERSION}.json"
          cmp --silent "$USER_FILE" "$TXT_FILE"
          EXPECTED_HASH="$(jq -r '.sha256' "$MANIFEST")"
          test "$(sha256sum "$USER_FILE" | awk '{print $1}')" = "$EXPECTED_HASH"
          test "$(jq -r '.version' "$MANIFEST")" = "$RELEASE_VERSION"

      - name: Upload immutable workflow backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: missionchief-toolkit-v${{ inputs.version }}-validated-release
          path: release-bundle/
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET_SHA: ${{ steps.release_start.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Exact validated release target SHA was not recorded."; exit 1; }
          gh release create "v${RELEASE_VERSION}" \
            --target "$RELEASE_TARGET_SHA" \
            --title "MissionChief Map Command Toolkit v${RELEASE_VERSION}" \
            --notes-file "release-bundle/CHANGELOG-v${RELEASE_VERSION}.md" \
            "release-bundle/MissionChief_Map_Command_Toolkit.user.js" \
            "release-bundle/MissionChief_Map_Command_Toolkit.txt" \
            "release-bundle/MissionChief_Map_Command_Toolkit.install.user.js" \
            "release-bundle/MissionChief_Map_Command_Toolkit.update.user.js" \
            "release-bundle/MissionChief_Map_Command_Toolkit.meta.js" \
            "release-bundle/MissionChief_Map_Command_Toolkit.css" \
            "release-bundle/MissionChief_Map_Command_Toolkit_v${RELEASE_VERSION}.user.js" \
            "release-bundle/MissionChief_Map_Command_Toolkit_v${RELEASE_VERSION}.txt" \
            "release-bundle/CHANGELOG-v${RELEASE_VERSION}.md" \
            "release-bundle/release-manifest-v${RELEASE_VERSION}.json" \
            "release-bundle/SHA256SUMS-v${RELEASE_VERSION}.txt" \
            "release-bundle/migration-handover-v${RELEASE_VERSION}.md"
          echo "created_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Verify live TKB distribution and private backup
        id: external
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MIGRATION_REPO_TOKEN: ${{ secrets.MIGRATION_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_OUTPUT="$RUNNER_TEMP/private-backup-output"
          FULL="release-bundle/MissionChief_Map_Command_Toolkit.user.js"
          INSTALL="release-bundle/MissionChief_Map_Command_Toolkit.install.user.js"
          UPDATE="release-bundle/MissionChief_Map_Command_Toolkit.update.user.js"
          META="release-bundle/MissionChief_Map_Command_Toolkit.meta.js"
          CSS="release-bundle/MissionChief_Map_Command_Toolkit.css"
          MANIFEST="release-bundle/release-manifest-v${RELEASE_VERSION}.json"
          for file in "$FULL" "$INSTALL" "$UPDATE" "$META" "$CSS" "$MANIFEST"; do test -f "$file"; done
          cmp --silent "$FULL" "$INSTALL"
          cmp --silent "$FULL" "$UPDATE"
          test "$(sed -nE 's|^//[[:space:]]*@version[[:space:]]+(.+)$|\1|p' "$META" | head -n 1 | xargs)" = "$RELEASE_VERSION"
          test "$(sha256sum "$CSS" | awk '{print $1}')" = "$(jq -r '.distribution.stylesheetSha256' "$MANIFEST")"

          INSTALL_URL="$(jq -r '.distribution.installUrl' .github/release-settings.json)"
          UPDATE_URL="$(jq -r '.distribution.updateUrl' .github/release-settings.json)"
          META_URL="$(jq -r '.distribution.metadataUrl' .github/release-settings.json)"
          TKB_VERIFIED=false
          for attempt in $(seq 1 18); do
            CACHE_BUST="$(date +%s%N)"
            if curl --fail --silent --show-error --location --compressed --max-time 30 \
                --header 'Cache-Control: no-cache' "${INSTALL_URL}?cache_bust=${CACHE_BUST}" \
                --output "$RUNNER_TEMP/tkb-install.user.js" && \
              curl --fail --silent --show-error --location --compressed --max-time 30 \
                --header 'Cache-Control: no-cache' "${UPDATE_URL}?cache_bust=${CACHE_BUST}" \
                --output "$RUNNER_TEMP/tkb-update.user.js" && \
              curl --fail --silent --show-error --location --compressed --max-time 30 \
                --header 'Cache-Control: no-cache' "${META_URL}?cache_bust=${CACHE_BUST}" \
                --output "$RUNNER_TEMP/tkb-meta.js"; then
              TKB_VERSION="$(sed -nE 's|^//[[:space:]]*@version[[:space:]]+(.+)$|\1|p' "$RUNNER_TEMP/tkb-meta.js" | head -n 1 | xargs)"
              if [[ "$TKB_VERSION" == "$RELEASE_VERSION" ]] && \
                cmp --silent "$FULL" "$RUNNER_TEMP/tkb-install.user.js" && \
                cmp --silent "$FULL" "$RUNNER_TEMP/tkb-update.user.js"; then
                TKB_VERIFIED=true
                break
              fi
            fi
            sleep 5
          done
          [[ "$TKB_VERIFIED" == "true" ]] || {
            echo "::error::Live TKB install, update and metadata endpoints do not all serve Toolkit ${RELEASE_VERSION}."
            exit 1
          }

          GITHUB_OUTPUT="$BACKUP_OUTPUT" bash .github/scripts/backup_release_to_private_repo.sh
          date +%s > "$RUNNER_TEMP/private-backup-epoch"
          BACKUP_COMMIT="$(sed -n 's/^backup_commit=//p' "$BACKUP_OUTPUT" | tail -n 1)"
          [[ -n "$BACKUP_COMMIT" ]]
          echo "backup_commit=$BACKUP_COMMIT" >> "$GITHUB_OUTPUT"
          echo "backup_epoch=$(cat "$RUNNER_TEMP/private-backup-epoch")" >> "$GITHUB_OUTPUT"

      - name: Post verified release to Discord
        id: discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}
          BACKUP_COMMIT: ${{ steps.external.outputs.backup_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DISCORD_WEBHOOK_URL:-}" ]] || { echo "::error::DISCORD_RELEASE_WEBHOOK is not configured."; exit 1; }
          [[ -n "${BACKUP_COMMIT:-}" ]] || { echo "::error::Private backup commit was not recorded."; exit 1; }
          SCRIPT_URL="$(jq -r '.distribution.productUrl' .github/release-settings.json)"
          HASH="$(jq -r '.sha256' "release-bundle/release-manifest-v${RELEASE_VERSION}.json")"

          python3 .github/scripts/build_discord_release_payload.py \
            --mode primary \
            --version "$RELEASE_VERSION" \
            --changelog "release-bundle/CHANGELOG-v${RELEASE_VERSION}.md" \
            --output discord-release-payload.json \
            --release-url "$RELEASE_URL" \
            --script-url "$SCRIPT_URL" \
            --sha256 "$HASH" \
            --backup-commit "$BACKUP_COMMIT"

          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 \
            --request POST --header "Content-Type: application/json" \
            --data @discord-release-payload.json "${DISCORD_WEBHOOK_URL}?wait=true" \
            > discord-release-response.json
          DISCORD_MESSAGE_ID="$(jq -r '.id // empty' discord-release-response.json)"
          DISCORD_CHANNEL_ID="$(jq -r '.channel_id // empty' discord-release-response.json)"
          [[ "$DISCORD_MESSAGE_ID" =~ ^[0-9]{17,22}$ && "$DISCORD_CHANNEL_ID" =~ ^[0-9]{17,22}$ ]] || {
            echo "::error::Discord did not return a valid release message identity."
            exit 1
          }
          echo "posted_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "posted_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "message_id=$DISCORD_MESSAGE_ID" >> "$GITHUB_OUTPUT"
          echo "channel_id=$DISCORD_CHANNEL_ID" >> "$GITHUB_OUTPUT"

      - name: Record successful release, manifest, announcement and speed state
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BACKUP_COMMIT: ${{ steps.external.outputs.backup_commit }}
          RELEASE_STARTED_EPOCH: ${{ steps.release_start.outputs.started_epoch }}
          RELEASE_STARTED_AT: ${{ steps.release_start.outputs.started_at }}
          GITHUB_RELEASE_EPOCH: ${{ steps.github_release.outputs.created_epoch }}
          GITHUB_RELEASE_AT: ${{ steps.github_release.outputs.created_at }}
          BACKUP_EPOCH: ${{ steps.external.outputs.backup_epoch }}
          DISCORD_EPOCH: ${{ steps.discord.outputs.posted_epoch }}
          DISCORD_AT: ${{ steps.discord.outputs.posted_at }}
          DISCORD_MESSAGE_ID: ${{ steps.discord.outputs.message_id }}
          DISCORD_CHANNEL_ID: ${{ steps.discord.outputs.channel_id }}
          VALIDATED_SHA: ${{ inputs.validated_sha }}
          RELEASE_SOURCE_SHA: ${{ steps.release_start.outputs.source_sha }}
          SOURCE_PR_NUMBER: ${{ inputs.pull_request_number }}
          SOURCE_PR_CREATED_AT: ${{ inputs.pr_created_at }}
          SOURCE_PR_MERGED_AT: ${{ inputs.pr_merged_at }}
          SOURCE_IMPLEMENTATION_READY_AT: ${{ inputs.implementation_ready_at }}
          SOURCE_VALIDATION_COMPLETED_AT: ${{ inputs.validation_completed_at }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERIFIED_EPOCH="$(date +%s)"
          HASH="$(jq -r '.sha256' "release-bundle/release-manifest-v${RELEASE_VERSION}.json")"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}"
          jq --arg version "$RELEASE_VERSION" --arg hash "$HASH" --arg now "$NOW" \
             --arg releaseUrl "$RELEASE_URL" --arg backupCommit "$BACKUP_COMMIT" \
             --arg discordMessageId "$DISCORD_MESSAGE_ID" --arg discordChannelId "$DISCORD_CHANNEL_ID" \
            'del(.status.greasyForkSync) |
             .currentVersion=$version |
             .status.validation="passed" |
             .status.githubRelease="published" |
             .status.tkbDistribution="verified" |
             .status.backup="private-repository-verified" |
             .status.discordRelease="posted" |
             .status.releaseReadiness="passed" |
             .releaseReadiness={version:$version,state:"passed",requiredSecrets:true,privateRepositoryReadWrite:true,tkbDistributionVerified:true,distributionAuthority:"tkb-website-only",publicReleaseCreated:true,completedAt:$now} |
             .latestRelease={version:$version,sha256:$hash,githubRelease:$releaseUrl,tkbDistributionVerified:true,distributionAuthority:"tkb-website-only",privateBackupCommit:$backupCommit,discordMessageId:$discordMessageId,discordChannelId:$discordChannelId,discordPosted:true,completedAt:$now} |
             .lastUpdated=$now' \
            status/release-dashboard.json > status/release-dashboard.tmp
          mv status/release-dashboard.tmp status/release-dashboard.json
          python3 .github/scripts/generate_release_dashboard.py
          python3 .github/scripts/build_stable_update_manifest.py
          test "$(jq -r '.version' status/update-manifest.json)" = "$RELEASE_VERSION"
          SOURCE_SHA="${VALIDATED_SHA:-$RELEASE_SOURCE_SHA}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Exact release candidate commit was not preserved."; exit 1; }
          PR_NUMBER="$SOURCE_PR_NUMBER"
          PR_CREATED_AT="$SOURCE_PR_CREATED_AT"
          PR_MERGED_AT="$SOURCE_PR_MERGED_AT"
          IMPLEMENTATION_READY_AT="$SOURCE_IMPLEMENTATION_READY_AT"
          VALIDATION_COMPLETED_AT="$SOURCE_VALIDATION_COMPLETED_AT"
          if [[ -z "$PR_NUMBER" || -z "$PR_CREATED_AT" || -z "$PR_MERGED_AT" ]]; then
            PR_JSON="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/pulls" 2>/dev/null || echo '[]')"
            RESOLVED_PR="$(jq -c '[.[] | select(.merged_at != null and .base.ref == "main")] | sort_by(.merged_at) | last // {}' <<< "$PR_JSON")"
            [[ -n "$PR_NUMBER" ]] || PR_NUMBER="$(jq -r '.number // empty' <<< "$RESOLVED_PR")"
            [[ -n "$PR_CREATED_AT" ]] || PR_CREATED_AT="$(jq -r '.created_at // empty' <<< "$RESOLVED_PR")"
            [[ -n "$PR_MERGED_AT" ]] || PR_MERGED_AT="$(jq -r '.merged_at // empty' <<< "$RESOLVED_PR")"
          fi
          PR_TO_VERIFIED=null; MERGE_TO_GITHUB=null; MERGE_TO_VERIFIED=null
          IMPLEMENTATION_TO_GREEN=null; GREEN_TO_MERGE=null
          if [[ -n "$PR_CREATED_AT" ]]; then PR_TO_VERIFIED=$(( VERIFIED_EPOCH - $(date -d "$PR_CREATED_AT" +%s) )); fi
          if [[ -n "$PR_MERGED_AT" ]]; then
            PR_MERGED_EPOCH="$(date -d "$PR_MERGED_AT" +%s)"
            MERGE_TO_GITHUB=$(( GITHUB_RELEASE_EPOCH - PR_MERGED_EPOCH ))
            MERGE_TO_VERIFIED=$(( VERIFIED_EPOCH - PR_MERGED_EPOCH ))
          fi
          if [[ -n "$IMPLEMENTATION_READY_AT" && -n "$VALIDATION_COMPLETED_AT" ]]; then
            IMPLEMENTATION_TO_GREEN=$(( $(date -d "$VALIDATION_COMPLETED_AT" +%s) - $(date -d "$IMPLEMENTATION_READY_AT" +%s) ))
          fi
          if [[ -n "$VALIDATION_COMPLETED_AT" && -n "$PR_MERGED_AT" ]]; then
            GREEN_TO_MERGE=$(( $(date -d "$PR_MERGED_AT" +%s) - $(date -d "$VALIDATION_COMPLETED_AT" +%s) ))
          fi
          for duration in "$PR_TO_VERIFIED" "$MERGE_TO_GITHUB" "$MERGE_TO_VERIFIED" "$IMPLEMENTATION_TO_GREEN" "$GREEN_TO_MERGE"; do
            [[ "$duration" == "null" || "$duration" -ge 0 ]] || { echo "::error::Release telemetry produced a negative duration."; exit 1; }
          done
          python3 .github/scripts/record_release_speed.py --version "$RELEASE_VERSION" --source "$SOURCE_SHA" --pr "${PR_NUMBER:-}" --pr-created "$PR_CREATED_AT" --merged "$PR_MERGED_AT" --implementation-ready "$IMPLEMENTATION_READY_AT" --validation-completed "$VALIDATION_COMPLETED_AT" --release-started "$RELEASE_STARTED_AT" --github-release "$GITHUB_RELEASE_AT" --discord "$DISCORD_AT" --verified "$NOW" --implementation-to-green "$IMPLEMENTATION_TO_GREEN" --green-to-merge "$GREEN_TO_MERGE" --pr-to-verified "$PR_TO_VERIFIED" --merge-to-github "$MERGE_TO_GITHUB" --merge-to-verified "$MERGE_TO_VERIFIED" --release-workflow "$(( VERIFIED_EPOCH - RELEASE_STARTED_EPOCH ))" --first-party 0 --backup "$(( BACKUP_EPOCH - GITHUB_RELEASE_EPOCH ))" --discord-seconds "$(( DISCORD_EPOCH - GITHUB_RELEASE_EPOCH ))" --attempts 0
          python3 .github/scripts/generate_release_speed_dashboard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            status/release-dashboard.json \
            status/README.md \
            status/update-manifest.json \
            status/release-speed-history.json \
            status/RELEASE_SPEED.md
          git commit -m "Record Toolkit ${RELEASE_VERSION} verified release state"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch GitHub Pages asynchronously
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run github-pages.yml --ref main
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages deployment dispatched asynchronously."

      - name: Write release summary
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BACKUP_COMMIT: ${{ steps.external.outputs.backup_commit }}
          PAGES_DISPATCHED: ${{ steps.pages.outputs.dispatched }}
        shell: bash
        run: |
          {
            echo "# Toolkit v${RELEASE_VERSION} release"
            echo
            echo "- ✅ Exact immutable canonical-validation candidate consumed"
            echo "- ✅ Duplicate release-readiness and production rebuilds skipped"
            echo "- ✅ Immutable release bundle reused without rebuilding"
            echo "- ✅ GitHub Release published"
            echo "- ✅ TKB Website install, update and metadata assets verified"
            echo "- ✅ Retired distribution channels were not generated, published or checked"
            echo "- ✅ Private migration backup committed: ${BACKUP_COMMIT}"
            echo "- ✅ Discord release announcement posted"
            echo "- ✅ Candidate, implementation-to-green, PR, merge and publication telemetry attributed to the exact validated commit"
            echo "- ✅ Dashboard, release-speed telemetry and stable update manifest updated atomically"
            echo "- ✅ GitHub Pages deployment dispatched asynchronously: ${PAGES_DISPATCHED}"
          } >> "$GITHUB_STEP_SUMMARY"
