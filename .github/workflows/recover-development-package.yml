name: Recover Reviewed Development Package

run-name: Recover development package for PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing owner-created package-only pull request number"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recover-development-package-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  recover:
    name: Apply and validate owner-reviewed package
    if: github.actor == 'Conroy1988'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve exact package-only pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Pull request number must be numeric."; exit 1; }
          data="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<< "$data")"
          merged="$(jq -r '.merged' <<< "$data")"
          base_ref="$(jq -r '.base.ref' <<< "$data")"
          head_ref="$(jq -r '.head.ref' <<< "$data")"
          head_sha="$(jq -r '.head.sha' <<< "$data")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$data")"
          author="$(jq -r '.user.login' <<< "$data")"
          [[ "$state" == "open" && "$merged" == "false" ]] || { echo "::error::Pull request must remain open and unmerged."; exit 1; }
          [[ "$base_ref" == "main" ]] || { echo "::error::Pull request must target main."; exit 1; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || { echo "::error::Fork pull requests are not accepted."; exit 1; }
          [[ "$author" == "Conroy1988" ]] || { echo "::error::Pull request must be owned by Conroy1988."; exit 1; }
          [[ "$head_ref" =~ ^(feature|fix|chore)/[A-Za-z0-9._/-]+$ ]] || { echo "::error::Head branch is outside the reviewed namespaces."; exit 1; }
          mapfile -t files < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          [[ "${#files[@]}" -eq 1 ]] || { echo "::error::Recovery accepts exactly one staged package file; found ${#files[@]}."; exit 1; }
          package="${files[0]}"
          [[ "$package" =~ ^\.github/development-packages/[A-Za-z0-9._/-]+\.py$ ]] || { echo "::error::The sole changed file is not a reviewed development package."; exit 1; }
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
          echo "expected_head=$head_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Require owner branch token
        env:
          OWNER_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OWNER_TOKEN" ]] || { echo "::error::DEVELOPMENT_PR_TOKEN is required."; exit 1; }

      - name: Check out exact authorized package head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.resolve.outputs.expected_head }}
          fetch-depth: 0
          token: ${{ secrets.DEVELOPMENT_PR_TOKEN }}

      - name: Reconfirm immutable refs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          EXPECTED_HEAD: ${{ steps.resolve.outputs.expected_head }}
          MAIN_SHA: ${{ steps.resolve.outputs.main_sha }}
          PACKAGE_PATH: ${{ steps.resolve.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/main:refs/remotes/origin/main" "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          [[ "$(git rev-parse origin/main)" == "$MAIN_SHA" ]] || { echo "::error::Main moved; dispatch recovery again."; exit 1; }
          [[ "$(git rev-parse origin/${BRANCH})" == "$EXPECTED_HEAD" ]] || { echo "::error::Package branch moved."; exit 1; }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" == "$EXPECTED_HEAD" ]] || { echo "::error::Pull request head moved."; exit 1; }
          [[ -f "$PACKAGE_PATH" && ! -L "$PACKAGE_PATH" ]] || { echo "::error::Reviewed package is missing or symbolic."; exit 1; }

      - name: Apply package against exact main
        env:
          MAIN_SHA: ${{ steps.resolve.outputs.main_sha }}
          PACKAGE_PATH: ${{ steps.resolve.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git rebase "$MAIN_SHA"
          python3 "$PACKAGE_PATH"
          rm -f "$PACKAGE_PATH"
          find .github/development-packages -type d -empty -delete 2>/dev/null || true

      - name: Validate exact resulting candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_userscript.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          git add -A
          git diff --cached --quiet && { echo "::error::Package produced no repository changes."; exit 1; }

      - name: Commit and publish with exact lease
        id: publish
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
          EXPECTED_HEAD: ${{ steps.resolve.outputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Apply reviewed development package"
          git push --force-with-lease="refs/heads/${BRANCH}:${EXPECTED_HEAD}" origin "HEAD:${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record recovery success
        env:
          GH_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RESULT_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Reviewed development-package recovery completed.\n\n- Result commit: \`${RESULT_SHA}\`\n- Exact main and PR heads were revalidated\n- Package payload was removed\n- Canonical validation, JavaScript syntax and distribution parity passed before the leased push"

      - name: Record recovery failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Reviewed development-package recovery failed safely. No validation gate was bypassed. Diagnostics: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
