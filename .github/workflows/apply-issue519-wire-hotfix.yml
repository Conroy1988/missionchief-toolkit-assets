name: Apply Issue 519 Incident Wire Hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/issue519/apply_hotfix.py"
      - ".github/workflows/apply-issue519-wire-hotfix.yml"

permissions:
  contents: read

concurrency:
  group: toolkit-issue-519-wire-hotfix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'Conroy1988' && github.head_ref == 'fix/issue-519-wire-resume-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/issue-519-wire-resume-alignment
          fetch-depth: 0
          persist-credentials: false

      - name: Apply v7.1.1 wire repair
        run: python3 .github/issue519/apply_hotfix.py

      - name: Validate complete v7.1.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_userscript.py
          bash .github/scripts/run_userscript_preflight.sh --contracts
          python3 .github/scripts/test_documentation_consistency.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt

      - name: Enforce unchanged performance envelope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:src/MissionChief_Map_Command_Toolkit.user.js > /tmp/performance-base.user.js
          python3 .github/scripts/test_performance_budget.py
          python3 .github/scripts/check_performance_budget.py \
            --candidate src/MissionChief_Map_Command_Toolkit.user.js \
            --base /tmp/performance-base.user.js \
            --policy .github/performance-budget.json \
            --json-output /tmp/issue519-performance.json \
            --markdown-output /tmp/issue519-performance.md
          cat /tmp/issue519-performance.md

      - name: Commit exact v7.1.1 candidate
        env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_PR_TOKEN"
          test "$GITHUB_HEAD_REF" = "fix/issue-519-wire-resume-alignment"
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No v7.1.1 hotfix changes produced."; exit 1; }
          git commit -m "Fix v7.1.1 Incident Command Wire resume and alignment"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/fix/issue-519-wire-resume-alignment
