name: Build Issue 519 v7.1.3 Continuous Reel Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/issue519/apply_v713_continuous_reel.py"
      - ".github/workflows/apply-issue519-v713-continuous-reel.yml"

permissions:
  contents: read

concurrency:
  group: toolkit-issue-519-v713-continuous-reel
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'Conroy1988' && github.head_ref == 'fix/issue-519-v713-reduced-motion-autoplay'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact v7.1.3 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/issue-519-v713-reduced-motion-autoplay
          fetch-depth: 0
          persist-credentials: false

      - name: Apply continuous news reel architecture
        run: python3 .github/issue519/apply_v713_continuous_reel.py

      - name: Remove redundant reel DOM lookup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          source_path = Path('src/MissionChief_Map_Command_Toolkit.user.js')
          fixture_path = Path('.github/fixtures/main-style-source-headroom.json')
          source = source_path.read_text(encoding='utf-8')
          old = "function refreshMajorIncidentFeedMotion(feed = document.getElementById(SCRIPT.majorIncidentFeedId),"
          new = "function refreshMajorIncidentFeedMotion(feed = document.querySelector?.(`#${SCRIPT.majorIncidentFeedId}`),"
          if source.count(old) != 1:
              raise SystemExit(f'Expected one redundant getElementById lookup, found {source.count(old)}')
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          start = source.index('function installMainStyles()')
          template_start = source.index('addStyle(`', start) + len('addStyle(`')
          metric = source.index("recordStartupMetric('stylesheetInstallMs'", template_start)
          template_end = source.rfind('`);', template_start, metric)
          raw = source[template_start:template_end]
          lines = raw.split('\n')
          canonical = re.sub(
              r'\n[\t ]*}',
              '}',
              '\n'.join(
                  line for index, line in enumerate(lines)
                  if not (0 < index < len(lines) - 1 and not line.strip())
              ),
          )
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          fixture['v7Candidate'].update({
              'sourceBytes': len(source.encode('utf-8')),
              'sourceLines': len(source.splitlines()),
              'sourceSha256': hashlib.sha256(source.encode('utf-8')).hexdigest(),
              'templateBytes': len(raw.encode('utf-8')),
              'templateLines': len(lines),
              'templateSha256': hashlib.sha256(raw.encode('utf-8')).hexdigest(),
              'canonicalCssSha256': hashlib.sha256(canonical.encode('utf-8')).hexdigest(),
          })
          fixture_path.write_text(json.dumps(fixture, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_userscript.py
          bash .github/scripts/run_userscript_preflight.sh --contracts
          python3 .github/scripts/test_documentation_consistency.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt

      - name: Enforce unchanged performance envelope
        shell: bash
        run: |
          set +e
          git fetch origin main --depth=1
          git show origin/main:src/MissionChief_Map_Command_Toolkit.user.js > /tmp/performance-base.user.js
          python3 .github/scripts/test_performance_budget.py
          TEST_STATUS=$?
          python3 .github/scripts/check_performance_budget.py \
            --candidate src/MissionChief_Map_Command_Toolkit.user.js \
            --base /tmp/performance-base.user.js \
            --policy .github/performance-budget.json \
            --json-output issue519-v713-continuous-reel.json \
            --markdown-output issue519-v713-continuous-reel.md
          CHECK_STATUS=$?
          cat issue519-v713-continuous-reel.md || true
          if [ "$TEST_STATUS" -ne 0 ]; then exit "$TEST_STATUS"; fi
          exit "$CHECK_STATUS"

      - name: Upload continuous reel performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue519-v713-continuous-reel-${{ github.sha }}
          path: |
            issue519-v713-continuous-reel.json
            issue519-v713-continuous-reel.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated continuous reel candidate
        env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_PR_TOKEN"
          test "$GITHUB_HEAD_REF" = "fix/issue-519-v713-reduced-motion-autoplay"
          rm -f issue519-v713-continuous-reel.json issue519-v713-continuous-reel.md
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No continuous reel changes produced."; exit 1; }
          git commit -m "Rebuild v7.1.3 Incident Command Wire as a continuous news reel"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/fix/issue-519-v713-reduced-motion-autoplay
