name: Issue 512 LSSM Coexistence Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/MissionChief_Map_Command_Toolkit.user.js"
      - ".github/scripts/diagnose_issue512_lssm_coexistence.py"
      - ".github/workflows/issue512-lssm-coexistence-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: issue512-lssm-coexistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Inventory Toolkit and LSSM runtime ownership
    if: github.head_ref == 'fix/issue-512-lssm-coexistence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact review state
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Generate coexistence ownership evidence
        run: python3 .github/scripts/diagnose_issue512_lssm_coexistence.py

      - name: Publish diagnostic summary
        run: cat issue512-lssm-coexistence-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue512-lssm-coexistence-diagnostic
          path: |
            issue512-lssm-coexistence-report.json
            issue512-lssm-coexistence-report.md
          if-no-files-found: error
          retention-days: 30
