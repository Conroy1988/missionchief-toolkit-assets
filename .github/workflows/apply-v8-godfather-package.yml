name: Apply v8 Godfather Reviewed Package

on:
  push:
    branches:
      - feature/v8-godfather-an-offer-he-cant-refuse
    paths:
      - ".github/development-packages/v8_godfather.py"
      - ".github/v8-godfather/**"
      - ".github/workflows/apply-v8-godfather-package.yml"
      - ".github/branch-write-inventory.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/development-packages/v8_godfather.py"
      - ".github/v8-godfather/**"
      - ".github/workflows/apply-v8-godfather-package.yml"
      - ".github/branch-write-inventory.json"

permissions:
  contents: read

concurrency:
  group: apply-v8-godfather-reviewed-package
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'Conroy1988/missionchief-toolkit-assets' &&
      ((github.event_name == 'push' && github.ref_name == 'feature/v8-godfather-an-offer-he-cant-refuse') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'feature/v8-godfather-an-offer-he-cant-refuse'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require reviewed owner credential
        env:
          OWNER_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OWNER_TOKEN" ]] || {
            echo "::error::DEVELOPMENT_PR_TOKEN is required for the reviewed v8 package."
            exit 1
          }

      - name: Check out exact reviewed branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feature/v8-godfather-an-offer-he-cant-refuse
          fetch-depth: 0
          token: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
          persist-credentials: true

      - name: Verify exact branch and package state
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/v8-godfather-an-offer-he-cant-refuse"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f .github/development-packages/v8_godfather.py
          test -f .github/v8-godfather/builder-parts/part-00.b64
          test -f .github/v8-godfather/builder-parts/part-01.b64
          test -f .github/v8-godfather/builder-parts/part-02.b64
          git diff --quiet
          git diff --cached --quiet

      - name: Apply integrity-pinned clean-room builder
        run: python3 .github/development-packages/v8_godfather.py

      - name: Remove one-shot writer and authority
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/development-packages/v8_godfather.py
          find .github/development-packages -type d -empty -delete 2>/dev/null || true
          rm -f .github/workflows/apply-v8-godfather-package.yml
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflow = '.github/workflows/apply-v8-godfather-package.yml'
          path = Path('.github/branch-write-inventory.json')
          inventory = json.loads(path.read_text(encoding='utf-8'))
          entries = inventory.get('reviewBranchWriters') or []
          retained = [entry for entry in entries if entry.get('workflow') != workflow]
          if len(entries) - len(retained) != 1:
              raise SystemExit('Temporary v8 review-writer inventory entry was not unique')
          inventory['reviewBranchWriters'] = retained
          path.write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate v8 JavaScript and theme contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          python3 .github/scripts/test_v8_godfather_contract.py
          python3 -m json.tool themes/godfather/manifest.json >/dev/null
          python3 -m json.tool docs/site-data.json >/dev/null
          python3 -m json.tool help/manifest.json >/dev/null
          python3 -m json.tool status/theme-asset-inventory.json >/dev/null
          python3 -m json.tool status/media-asset-audit.json >/dev/null

      - name: Run canonical userscript validation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_userscript.py
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt

      - name: Validate branch-write inventory
        run: python3 .github/scripts/test_branch_write_inventory.py

      - name: Audit final Actions security state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_actions_security.py \
            --json-report /tmp/actions-security-report.json \
            --markdown-report /tmp/actions-security-report.md

      - name: Commit exact validated result
        env:
          BRANCH: feature/v8-godfather-an-offer-he-cant-refuse
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "::error::Reviewed v8 package produced no repository changes."
            exit 1
          }
          git commit -m "Implement v8.0.0 Godfather interface"
          git push --force-with-lease="refs/heads/${BRANCH}:${EXPECTED_HEAD}" origin "HEAD:${BRANCH}"
