name: Validate v6 Critical Performance Programme

on:
  pull_request:
    paths:
      - "src/MissionChief_Map_Command_Toolkit.user.js"
      - ".github/fixtures/v6-performance-budget.json"
      - ".github/scripts/test_v6_*.py"
      - ".github/workflows/v6-critical-performance.yml"
      - "docs/audits/v6-critical-performance-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-v6-critical-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate v6 retirement, settings and runtime budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate JavaScript syntax
        run: node --check src/MissionChief_Map_Command_Toolkit.user.js

      - name: Validate clean feature retirement
        run: python3 .github/scripts/test_v6_feature_retirement.py

      - name: Validate retained Mission Age map badges
        run: python3 .github/scripts/test_v6_mission_age_retention.py

      - name: Validate typed Operational Window settings
        run: python3 .github/scripts/test_v6_operational_settings_contract.py

      - name: Enforce v6 runtime budgets
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/test_v6_operational_runtime_budget.py \
            | tee v6-critical-performance-budget.json

      - name: Validate evidence files
        run: |
          python3 -m json.tool .github/fixtures/v6-performance-budget.json >/dev/null
          python3 -m json.tool docs/audits/v6-critical-performance-evidence.json >/dev/null
          test -s docs/audits/v6-critical-performance-baseline.md
          grep -Fq 'browserEvidenceState' docs/audits/v6-critical-performance-evidence.json
          grep -Fq 'No FPS or elapsed-time claim is made' docs/audits/v6-critical-performance-baseline.md

      - name: Upload immutable v6 performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: missionchief-v6-critical-performance-${{ github.sha }}
          path: |
            v6-critical-performance-budget.json
            docs/audits/v6-critical-performance-baseline.md
            docs/audits/v6-critical-performance-evidence.json
          if-no-files-found: error
          retention-days: 30
