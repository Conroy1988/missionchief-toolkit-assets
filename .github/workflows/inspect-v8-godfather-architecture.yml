name: Materialise v8 Godfather Development Inputs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/v8-godfather/**"
      - ".github/workflows/inspect-v8-godfather-architecture.yml"

permissions:
  contents: read

jobs:
  materialise:
    if: github.actor == 'Conroy1988' && github.head_ref == 'feat/v8-godfather-an-offer-he-cant-refuse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact v8 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/v8-godfather-an-offer-he-cant-refuse
          fetch-depth: 1
          persist-credentials: false

      - name: Extract theme and payout architecture
        run: python3 .github/v8-godfather/inspect_architecture.py

      - name: Materialise staged builder and supplied payout audio
        id: materialise
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8-materialised

          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import traceback
          from pathlib import Path

          output = Path('v8-materialised')
          debug: dict[str, object] = {'sourceCommit': '${{ github.sha }}'}

          def read_parts(directory: Path) -> tuple[list[Path], list[str]]:
              parts = sorted(directory.glob('part-*.b64'))
              if not parts:
                  raise RuntimeError(f'No transport parts found in {directory}')
              texts = [''.join(path.read_text(encoding='utf-8').split()) for path in parts]
              debug[str(directory)] = [
                  {
                      'name': path.name,
                      'fileBytes': path.stat().st_size,
                      'base64Chars': len(text),
                      'mod4': len(text) % 4,
                      'head': text[:16],
                      'tail': text[-16:],
                  }
                  for path, text in zip(parts, texts, strict=True)
              ]
              return parts, texts

          def decode_joined(texts: list[str]) -> bytes:
              joined = ''.join(texts)
              joined += '=' * ((-len(joined)) % 4)
              return base64.b64decode(joined, validate=True)

          def recover_gzip_payload(parts: list[Path], texts: list[str]) -> tuple[bytes, bytes, dict[str, object]]:
              initial_error = None
              try:
                  transport = decode_joined(texts)
                  return transport, gzip.decompress(transport), {'mode': 'exact'}
              except Exception as error:
                  initial_error = repr(error)

              candidates = [index for index, text in enumerate(texts) if len(text) % 4 == 1]
              if not candidates:
                  candidates = list(range(len(texts)))

              tested = 0
              for part_index in candidates:
                  text = texts[part_index]
                  for char_index in range(len(text)):
                      candidate_texts = texts.copy()
                      candidate_texts[part_index] = text[:char_index] + text[char_index + 1:]
                      if sum(map(len, candidate_texts)) % 4:
                          continue
                      tested += 1
                      try:
                          transport = decode_joined(candidate_texts)
                          payload = gzip.decompress(transport)
                      except Exception:
                          continue
                      return transport, payload, {
                          'mode': 'removed-one-extra-base64-character',
                          'part': parts[part_index].name,
                          'index': char_index,
                          'character': text[char_index],
                          'testedCandidates': tested,
                          'initialError': initial_error,
                      }

              raise RuntimeError(
                  f'Builder transport was not recoverable after {tested} single-character candidates; '
                  f'initial error={initial_error}'
              )

          def decode_audio(parts: list[Path], texts: list[str]) -> tuple[bytes, dict[str, object]]:
              attempts: list[dict[str, object]] = []
              try:
                  payload = decode_joined(texts)
                  attempts.append({'mode': 'continuous', 'ok': True, 'bytes': len(payload)})
                  return payload, {'mode': 'continuous', 'attempts': attempts}
              except Exception as error:
                  attempts.append({'mode': 'continuous', 'ok': False, 'error': repr(error)})

              decoded: list[bytes] = []
              try:
                  for text in texts:
                      padded = text + ('=' * ((-len(text)) % 4))
                      decoded.append(base64.b64decode(padded, validate=True))
                  payload = b''.join(decoded)
                  attempts.append({
                      'mode': 'independent-padded',
                      'ok': True,
                      'bytes': len(payload),
                      'partBytes': [len(item) for item in decoded],
                  })
                  return payload, {'mode': 'independent-padded', 'attempts': attempts}
              except Exception as error:
                  attempts.append({'mode': 'independent-padded', 'ok': False, 'error': repr(error)})
                  raise RuntimeError(f'Audio transport decode failed: {attempts}') from error

          failure: str | None = None
          try:
              builder_parts, builder_texts = read_parts(Path('.github/v8-godfather/builder-parts'))
              builder_transport, builder_payload, recovery = recover_gzip_payload(builder_parts, builder_texts)
              builder = output / 'v8_godfather_builder.py'
              builder.write_bytes(builder_payload)
              debug['builderTransport'] = {
                  'bytes': len(builder_transport),
                  'head': builder_transport[:16].hex(),
                  'tail': builder_transport[-16:].hex(),
                  'sha256': hashlib.sha256(builder_transport).hexdigest(),
                  'recovery': recovery,
              }
              debug['builder'] = {
                  'bytes': len(builder_payload),
                  'sha256': hashlib.sha256(builder_payload).hexdigest(),
              }

              audio_parts, audio_texts = read_parts(Path('.github/v8-godfather/audio-parts'))
              audio_payload, audio_decode = decode_audio(audio_parts, audio_texts)
              audio = output / 'godfather-flash-payout.mp3'
              audio.write_bytes(audio_payload)
              debug['audio'] = {
                  'parts': [path.name for path in audio_parts],
                  'bytes': len(audio_payload),
                  'sha256': hashlib.sha256(audio_payload).hexdigest(),
                  'head': audio_payload[:16].hex(),
                  'tail': audio_payload[-16:].hex(),
                  'decode': audio_decode,
              }

              if len(audio_payload) < 32_000:
                  raise RuntimeError(f'Godfather payout audio is unexpectedly small: {len(audio_payload)} bytes')
              if not (audio_payload.startswith(b'ID3') or audio_payload[:2] in {b'\xff\xfb', b'\xff\xf3', b'\xff\xf2'}):
                  raise RuntimeError('Godfather payout audio does not have an MP3 signature')
          except Exception as error:
              failure = f'{type(error).__name__}: {error}'
              debug['failure'] = failure
              debug['traceback'] = traceback.format_exc()
          finally:
              (output / 'transport-debug.json').write_text(
                  json.dumps(debug, indent=2) + '\n', encoding='utf-8'
              )

          if failure:
              raise SystemExit(failure)
          PY

          python3 -m py_compile v8-materialised/v8_godfather_builder.py

          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error \
              -show_entries format=duration,size,bit_rate:stream=codec_name,channels,sample_rate \
              -of json \
              v8-materialised/godfather-flash-payout.mp3 \
              > v8-materialised/audio-probe.json
          else
            printf '{"warning":"ffprobe unavailable"}\n' > v8-materialised/audio-probe.json
          fi

          python3 v8-materialised/v8_godfather_builder.py --help \
            > v8-materialised/builder-help.txt 2>&1 || true

      - name: Stage exact development inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8-inputs/.github/scripts v8-inputs/.github/fixtures v8-inputs/docs v8-inputs/help v8-inputs/status v8-inputs/themes
          cp src/MissionChief_Map_Command_Toolkit.user.js v8-inputs/source.user.js
          cp CHANGELOG.md README.md v8-inputs/
          cp help/index.html help/manifest.json v8-inputs/help/
          cp docs/site-data.json v8-inputs/docs/
          cp status/theme-asset-inventory.json status/media-asset-audit.json v8-inputs/status/
          cp .github/scripts/validate_userscript.py .github/scripts/test_asset_health.py .github/scripts/test_main_style_source_headroom.py .github/scripts/run_userscript_preflight.sh v8-inputs/.github/scripts/
          cp .github/fixtures/main-style-source-headroom.json v8-inputs/.github/fixtures/
          cp -R themes/* v8-inputs/themes/

      - name: Upload architecture, exact inputs and materialised payloads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-godfather-materialised-${{ github.sha }}
          path: |
            v8-godfather-architecture.txt
            v8-inputs
            v8-materialised
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce successful materialisation
        if: steps.materialise.outcome != 'success'
        run: |
          cat v8-materialised/transport-debug.json || true
          exit 1
