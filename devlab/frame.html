<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Toolkit fixture</title>
  <link rel="stylesheet" href="/devlab/fixture.css">
</head>
<body>
  <header id="navbar-main" class="game-header">
    <strong>MissionChief</strong>
    <span id="credits">50,000,000 Credits</span>
    <nav><button>Buildings</button><button>Alliance</button><button>Missions</button></nav>
    <ul id="map_filters" hidden aria-label="MissionChief map filters">
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_22" value="22" checked> Ambulance Station</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_6" value="6" checked> Police Station</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_2" value="2" checked> Fire Station</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_hospital" value="hospital_missions" checked> Hospital</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_ambulance_small" value="ambulance_station_small_missions" checked> Ambulance Station (Small station)</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_fire_small" value="firehouse_small_missions" checked> Fire Station (Small station)</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_police_small" value="police_small_missions" checked> Police Station (Small station)</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_medical_helicopter" value="rescue_copter_station_missions" checked> Medical Helicopter Station</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_police_aviation" value="police_copter_station_missions" checked> Police Aviation</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_dispatch" value="dispatch_center_missions" checked> Dispatch Centre</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_fire_academy" value="fire_school_missions" checked> Fire Academy</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_medical_academy" value="rescue_school_missions" checked> Medical Academy</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_police_training" value="police_school_missions" checked> Police Training Centre</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_search_rescue_hq" value="technical_aid_missions" checked> Search and Rescue HQ</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_coastguard" value="coastal_rescue_missions" checked> Coastguard Rescue Station</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_lifeboat" value="coastal_rescue" checked> Lifeboat Station</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_hart" value="hart_base" checked> HART Base</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_home_response" value="home_response_location" checked> Home Response Location</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_gp" value="general_practitioner" checked> GP Surgery</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_urgent_treatment" value="clinic_missions" checked> Urgent Treatment Centre</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_mountain_rescue" value="mountain_rescue_missions" checked> Mountain Rescue Station</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_coastal_heliport" value="coastal_rescue_heliport" checked> Coastal Rescue Heliport</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_search_rescue_college" value="search_rescue_college" checked> Search and Rescue College</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_recovery" value="tow_trucks_missions" checked> Recovery Centre</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_bomb_disposal" value="bomb_disposal_missions" checked> Bomb Disposal HQ</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_police_depot" value="large_police_depot" checked> Large Police Depot</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_custody" value="custody_suite" checked> Custody Suite</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_prison" value="prison_missions" checked> Prison</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_staging" value="staging_area_missions" checked> Staging Area</label></li>
      <li class="filter_list__element building-filter"><label><input type="checkbox" id="filter_complex" value="building_complex" checked> Building Complex</label></li>
    </ul>
  </header>
  <div id="map_outer">
    <div id="map" class="leaflet-container" data-leaflet-map="main" aria-label="MissionChief map">
      <div class="leaflet-map-pane">
        <div class="leaflet-tile-pane"></div>
        <div class="leaflet-marker-pane" data-fixture-markers></div>
      </div>
    </div>
  </div>
  <aside id="missions" class="mission-list" aria-label="Missions">
    <article class="missionSideBarEntry" mission_id="1001"><strong>Warehouse Fire</strong><small>25,000 Credits</small></article>
    <article class="missionSideBarEntry" mission_id="1002"><strong>Road Traffic Collision</strong><small>8,500 Credits</small></article>
  </aside>
  <div id="radio_messages_important"></div>
  <script src="/devlab/frame.js"></script>
</body>
</html>
