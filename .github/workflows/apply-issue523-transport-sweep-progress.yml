name: Apply Issue 523 Transport Sweep Progress Fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/issue523/apply_fix.py"
      - ".github/workflows/apply-issue523-transport-sweep-progress.yml"

permissions:
  contents: read

concurrency:
  group: toolkit-issue-523-transport-sweep-progress
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'Conroy1988' && github.head_ref == 'fix/issue-523-transport-sweep-mission-progress'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Issue 523 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/issue-523-transport-sweep-mission-progress
          fetch-depth: 0
          persist-credentials: false

      - name: Make candidate README update format-independent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/issue523/apply_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''    readme = README.read_text(encoding="utf-8")
              readme = replace_once(
                  readme,
                  "## **Current verified release: `v7.1.3`**\\n### **Continuous Incident Command news reel**",
                  "## **Current verified release: `v7.1.3` · Development candidate: `v7.1.4`**\\n### **Patient Transport Sweep mission-progress synchronization**",
                  "README candidate marker",
              )
              README.write_text(readme, encoding="utf-8")
          '''
          new = '''    readme = README.read_text(encoding="utf-8")
              readme, readme_count = re.subn(
                  r"## \\*\\*Current verified release: `v[^`]+`[^\\n]*\\*\\*",
                  "## **Current verified release: `v7.1.3` · Development candidate: `v7.1.4` — Patient Transport Sweep mission-progress synchronization**",
                  readme,
                  count=1,
              )
              if readme_count != 1:
                  raise SystemExit(f"Expected one README release heading, found {readme_count}")
              README.write_text(readme, encoding="utf-8")
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one README update block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply canonical mission-progress synchronization
        id: apply
        shell: bash
        run: |
          set +e
          set -o pipefail
          python3 .github/issue523/apply_fix.py 2>&1 | tee issue523-builder.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Issue 523 builder diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue523-builder-${{ github.sha }}
          path: issue523-builder.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop on builder failure
        if: steps.apply.outputs.exit_code != '0'
        run: exit 1

      - name: Make Incident Wire contract patch-release safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/test_issue517_incident_command_wire.py')
          text = path.read_text(encoding='utf-8')
          old = " assert metadata and runtime and metadata.group(1)==runtime.group(1)=='7.1.3'\n"
          new = " assert metadata and runtime and metadata.group(1)==runtime.group(1)\n version=tuple(int(part) for part in metadata.group(1).split('.'))\n assert version >= (7,1,3)\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one exact v7.1.3 contract assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate complete v7.1.4 candidate
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 .github/scripts/validate_userscript.py &&
            bash .github/scripts/run_userscript_preflight.sh --contracts &&
            python3 .github/scripts/test_documentation_consistency.py &&
            node --check src/MissionChief_Map_Command_Toolkit.user.js &&
            cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          } 2>&1 | tee issue523-validation.log

      - name: Upload Issue 523 validation diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue523-validation-${{ github.sha }}
          path: issue523-validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce unchanged performance envelope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:src/MissionChief_Map_Command_Toolkit.user.js > /tmp/performance-base.user.js
          python3 .github/scripts/test_performance_budget.py
          python3 .github/scripts/check_performance_budget.py \
            --candidate src/MissionChief_Map_Command_Toolkit.user.js \
            --base /tmp/performance-base.user.js \
            --policy .github/performance-budget.json \
            --json-output /tmp/issue523-performance.json \
            --markdown-output /tmp/issue523-performance.md
          cat /tmp/issue523-performance.md

      - name: Commit exact v7.1.4 candidate
        env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_PR_TOKEN"
          test "$GITHUB_HEAD_REF" = "fix/issue-523-transport-sweep-mission-progress"
          rm -f issue523-builder.log issue523-validation.log
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No Issue 523 changes produced."; exit 1; }
          git commit -m "Fix v7.1.4 Transport Sweep mission progress"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/fix/issue-523-transport-sweep-mission-progress
