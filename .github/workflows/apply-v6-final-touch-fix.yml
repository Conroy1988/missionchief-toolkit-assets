name: Apply v6 Final Touch Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/v6-final/fix_touch_feedback.py"
      - ".github/workflows/apply-v6-final-touch-fix.yml"
      - ".github/workflows/apply-v6-final-audit-closure.yml"

permissions:
  contents: read

concurrency:
  group: toolkit-v6-final-touch-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'Conroy1988' && github.head_ref == 'feat/issue-510-v6-performance-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact v6 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/issue-510-v6-performance-overhaul
          fetch-depth: 0
          persist-credentials: false

      - name: Restore touch feedback and refresh evidence
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/source_lines = source.count("\\n") + 1/source_lines = len(source.splitlines())/' \
            .github/v6-final/fix_touch_feedback.py
          python3 .github/v6-final/fix_touch_feedback.py

      - name: Build and validate final candidate distribution
        run: python3 .github/scripts/validate_userscript.py

      - name: Validate final audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_ios_safari_usability_contract.py
          python3 .github/scripts/test_main_style_source_headroom.py
          python3 -m py_compile .github/scripts/extract_userscript_audit_evidence.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent src/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt

      - name: Remove one-use final builders
        run: |
          rm -f .github/v6-final/fix_touch_feedback.py
          rm -f .github/workflows/apply-v6-final-touch-fix.yml
          rm -f .github/workflows/apply-v6-final-audit-closure.yml
          rmdir .github/v6-final 2>/dev/null || true

      - name: Commit exact final v6 candidate
        env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_PR_TOKEN"
          test "$GITHUB_HEAD_REF" = "feat/issue-510-v6-performance-overhaul"
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A -- \
            src/MissionChief_Map_Command_Toolkit.user.js \
            dist/MissionChief_Map_Command_Toolkit.user.js \
            dist/MissionChief_Map_Command_Toolkit.txt \
            dist/SHA256SUMS.txt \
            dist/release-manifest.json \
            .github/fixtures/main-style-source-headroom.json \
            docs/audits/v6-critical-performance-evidence.json \
            docs/audits/v6-critical-performance-baseline.md \
            .github/v6-final/fix_touch_feedback.py \
            .github/workflows/apply-v6-final-touch-fix.yml \
            .github/workflows/apply-v6-final-audit-closure.yml
          git diff --cached --quiet && { echo "No final v6 touch fix required."; exit 0; }
          git commit -m "Restore retained touch feedback and finalise v6 evidence"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/feat/issue-510-v6-performance-overhaul
