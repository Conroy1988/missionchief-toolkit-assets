name: Build v8.0.2 Godfather Layout and Audio Hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-v8.0.2-godfather-hotfix.yml"
      - ".github/v8.0.2/**"
      - ".github/actions-security-policy.json"

permissions:
  contents: write

concurrency:
  group: v8-0-2-godfather-layout-audio-hotfix
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'Conroy1988' && github.head_ref == 'hotfix/v8.0.2-godfather-layout-audio'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: hotfix/v8.0.2-godfather-layout-audio
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact supplied audio transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > v8-hotfix-inputs.txt 2>&1
          from pathlib import Path
          import base64
          import hashlib

          source = Path('src/MissionChief_Map_Command_Toolkit.user.js').read_bytes()
          exact_parts = sorted(Path('.github/v8.0.2/audio-exact').glob('part-*.b64'))
          encoded_parts = [path.read_text(encoding='ascii').strip() for path in exact_parts]
          encoded = ''.join(encoded_parts)
          print('source_sha256', hashlib.sha256(source).hexdigest())
          print('exact_part_count', len(exact_parts))
          print('exact_part_names', [path.name for path in exact_parts])
          print('exact_part_lengths', [len(value) for value in encoded_parts])
          print('encoded_length', len(encoded))
          decoded = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(decoded).hexdigest()
          print('decoded_bytes', len(decoded))
          print('decoded_sha256', digest)
          if len(decoded) != 136254:
              raise SystemExit(f'Exact audio byte size mismatch: {len(decoded)}')
          if digest != '53160bd03bacf043ea3b0ffbd202163c2621e16a47ecd0f7090bfeacaf00b0d4':
              raise SystemExit(f'Exact audio digest mismatch: {digest}')

          expected_lengths = [12000, 12000, 60000, 60000, 37672]
          if sum(expected_lengths) != len(encoded):
              raise SystemExit(f'Exact encoded length mismatch: {len(encoded)}')
          target = Path('.github/v8.0.2/audio-parts')
          target.mkdir(parents=True, exist_ok=True)
          offset = 0
          for index, length in enumerate(expected_lengths):
              payload = encoded[offset:offset + length]
              offset += length
              (target / f'part-{index:02d}.b64').write_text(payload, encoding='ascii')
          print('legacy_part_lengths', expected_lengths)
          PY
          python3 -m py_compile .github/v8.0.2/build_hotfix.py
          cat v8-hotfix-inputs.txt

      - name: Build exact v8.0.2 candidate
        id: build
        shell: bash
        run: |
          set +e
          python3 .github/v8.0.2/build_hotfix.py > v8-hotfix-build.log 2>&1
          status=$?
          cat v8-hotfix-build.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload hotfix build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-0-2-godfather-hotfix-diagnostics
          path: |
            v8-hotfix-inputs.txt
            v8-hotfix-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on build failure
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "The deterministic v8.0.2 builder failed. Review the retained diagnostics."
          exit 1

      - name: Remove temporary builder and permission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import shutil

          policy_path = Path('.github/actions-security-policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          removed = policy['allowedWritePermissions'].pop(
              '.github/workflows/build-v8.0.2-godfather-hotfix.yml',
              None,
          )
          if removed != ['contents']:
              raise SystemExit(f'Unexpected temporary writer policy: {removed!r}')
          policy_path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/build-v8.0.2-godfather-hotfix.yml').unlink()
          shutil.rmtree('.github/v8.0.2')
          PY

      - name: Validate exact repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          python3 .github/scripts/test_issue539_godfather_layout_audio.py
          python3 .github/scripts/test_issue537_godfather_css_activation.py
          python3 .github/scripts/test_v8_godfather_contract.py
          python3 .github/scripts/test_main_style_source_headroom.py
          bash .github/scripts/run_userscript_preflight.sh
          python3 .github/scripts/validate_userscript.py
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          test ! -e .github/workflows/build-v8.0.2-godfather-hotfix.yml
          test ! -e .github/v8.0.2

      - name: Commit exact v8.0.2 hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f v8-hotfix-inputs.txt v8-hotfix-build.log
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git commit -m "Fix Godfather layout and payout audio for v8.0.2"
          git push origin HEAD:hotfix/v8.0.2-godfather-layout-audio
