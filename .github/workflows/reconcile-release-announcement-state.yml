name: Verify Release Announcement State

on:
  workflow_run:
    workflows:
      - Release Toolkit
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-announcement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release announcement state
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact verified state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Overlay authoritative release-state dashboard
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            +refs/heads/release-state:refs/remotes/origin/release-state
          git restore --source=refs/remotes/origin/release-state -- \
            status/release-dashboard.json

      - name: Verify dashboard and first-party authority
        id: state
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p announcement-state

          DASHBOARD="status/release-dashboard.json"
          DASHBOARD_VERSION="$(jq -r '.latestRelease.version // empty' "$DASHBOARD")"
          DISTRIBUTION_AUTHORITY="$(jq -r '.latestRelease.distributionAuthority // empty' "$DASHBOARD")"
          TKB_DISTRIBUTION_VERIFIED="$(jq -r '.latestRelease.tkbDistributionVerified // false' "$DASHBOARD")"
          DISCORD_POSTED="$(jq -r '.latestRelease.discordPosted // false' "$DASHBOARD")"

          ACCEPTABLE=false
          STATE="inconsistent"
          if [[ -n "$DASHBOARD_VERSION" &&
                "$DISTRIBUTION_AUTHORITY" == "tkb-website-only" &&
                "$TKB_DISTRIBUTION_VERIFIED" == "true" &&
                "$DISCORD_POSTED" == "true" ]]; then
            ACCEPTABLE=true
            STATE="synchronized"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg dashboardVersion "$DASHBOARD_VERSION" \
            --arg distributionAuthority "$DISTRIBUTION_AUTHORITY" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg generatedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson acceptable "$ACCEPTABLE" \
            --argjson tkbDistributionVerified "$TKB_DISTRIBUTION_VERIFIED" \
            --argjson discordPosted "$DISCORD_POSTED" \
            '{
              schemaVersion: 1,
              state: $state,
              acceptable: $acceptable,
              sourceCommit: $sourceCommit,
              generatedAt: $generatedAt,
              dashboardVersion: $dashboardVersion,
              distributionAuthority: $distributionAuthority,
              tkbDistributionVerified: $tkbDistributionVerified,
              discordPosted: $discordPosted,
              publicMainChanged: false,
              releaseDashboardChanged: false
            }' > announcement-state/release-announcement-state.json

          {
            echo "# Release announcement state"
            echo
            echo "- State: **${STATE}**"
            echo "- Dashboard version: \`${DASHBOARD_VERSION:-missing}\`"
            echo "- Distribution authority: \`${DISTRIBUTION_AUTHORITY:-missing}\`"
            echo "- TKB distribution verified: **${TKB_DISTRIBUTION_VERIFIED}**"
            echo "- Discord posted: **${DISCORD_POSTED}**"
            echo "- Public main changed: **no**"
          } > announcement-state/release-announcement-state.md

          [[ "$ACCEPTABLE" == "true" ]]

      - name: Upload immutable announcement-state evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: missionchief-release-announcement-state-${{ github.sha }}
          path: announcement-state/
          if-no-files-found: error
          retention-days: 30

      - name: Publish announcement-state summary
        if: always()
        shell: bash
        run: |
          if [[ -f announcement-state/release-announcement-state.md ]]; then
            cat announcement-state/release-announcement-state.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce announcement-state result
        if: steps.state.outcome != 'success'
        run: |
          echo "Verified release dashboard, TKB-only distribution authority and Discord state are inconsistent. No automatic mutation was attempted."
          exit 1
