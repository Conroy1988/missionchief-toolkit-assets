name: Temporary Full Production Health Audit

on:
  push:
    branches:
      - audit/full-production-health-v8-2-0

permissions:
  contents: read

env:
  AUDIT_BRANCH: audit/full-production-health-v8-2-0
  AUDIT_WORKFLOW: .github/workflows/temporary-full-production-health-audit.yml
  EXPECTED_BASE: 0eea1140d2588e9b2aec3884da4bc87f564904f1

concurrency:
  group: temporary-full-production-health-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.repository == 'Conroy1988/missionchief-toolkit-assets' &&
      github.ref == 'refs/heads/audit/full-production-health-v8-2-0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MCMS_AUDIT_OUTPUT: ${{ runner.temp }}/audit-output
      MCMS_AUDIT_REPEATS: '8'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - name: Require owner branch token
        env:
          OWNER_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OWNER_TOKEN" ]] || { echo 'DEVELOPMENT_PR_TOKEN is required.' >&2; exit 1; }

      - name: Check out exact audit head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
          show-progress: false

      - name: Verify exact audit authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git merge-base --is-ancestor origin/main HEAD
          test -f "$AUDIT_WORKFLOW"
          test -f .github/scripts/audit_full_production_health.py
          test -f .github/scripts/audit_runtime_stress.mjs

      - name: Install isolated runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0

      - name: Run, record and publish complete audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$MCMS_AUDIT_OUTPUT"
          sha256sum src/MissionChief_Map_Command_Toolkit.user.js > "$MCMS_AUDIT_OUTPUT/source-before.sha256"
          git status --short > "$MCMS_AUDIT_OUTPUT/git-status-before.txt"
          status=0

          echo '[audit] canonical validation and complete retained preflight'
          /usr/bin/time -v -o "$MCMS_AUDIT_OUTPUT/preflight-time.txt" \
            bash .github/scripts/run_userscript_preflight.sh --all \
            > >(tee "$MCMS_AUDIT_OUTPUT/preflight.log") 2>&1 || status=1

          echo '[audit] lifecycle, recurring-work and teardown inventory'
          python3 -X dev .github/scripts/audit_full_production_health.py \
            > >(tee "$MCMS_AUDIT_OUTPUT/full-production-health.log") 2>&1 || status=1

          echo '[audit] repeated runtime, lifecycle and memory stress'
          /usr/bin/time -v -o "$MCMS_AUDIT_OUTPUT/runtime-stress-time.txt" \
            node .github/scripts/audit_runtime_stress.mjs \
            > >(tee "$MCMS_AUDIT_OUTPUT/runtime-stress.log") 2>&1 || status=1

          echo '[audit] deterministic second retained preflight'
          /usr/bin/time -v -o "$MCMS_AUDIT_OUTPUT/preflight-repeat-time.txt" \
            bash .github/scripts/run_userscript_preflight.sh --all \
            > >(tee "$MCMS_AUDIT_OUTPUT/preflight-repeat.log") 2>&1 || status=1

          sha256sum src/MissionChief_Map_Command_Toolkit.user.js > "$MCMS_AUDIT_OUTPUT/source-after.sha256"
          cmp --silent "$MCMS_AUDIT_OUTPUT/source-before.sha256" "$MCMS_AUDIT_OUTPUT/source-after.sha256" || {
            echo 'Canonical source changed during the audit.' | tee "$MCMS_AUDIT_OUTPUT/source-mutation.txt"
            status=1
          }
          cmp --silent src/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.user.js || status=1
          cmp --silent src/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt || status=1

          rm -rf node_modules
          git status --short > "$MCMS_AUDIT_OUTPUT/git-status-after.txt"
          if [[ -s "$MCMS_AUDIT_OUTPUT/git-status-after.txt" ]]; then
            echo 'Repository working tree changed during the read-only audit:'
            cat "$MCMS_AUDIT_OUTPUT/git-status-after.txt"
            status=1
          fi

          echo "audit_status=$status" | tee "$MCMS_AUDIT_OUTPUT/final-status.txt"
          mkdir -p docs/audits/issue-567
          cp "$MCMS_AUDIT_OUTPUT/full-production-health.json" docs/audits/issue-567/full-production-health.json 2>/dev/null || true
          cp "$MCMS_AUDIT_OUTPUT/full-production-health.md" docs/audits/issue-567/full-production-health.md 2>/dev/null || true
          cp "$MCMS_AUDIT_OUTPUT/runtime-stress.json" docs/audits/issue-567/runtime-stress.json 2>/dev/null || true
          cp "$MCMS_AUDIT_OUTPUT/runtime-stress.md" docs/audits/issue-567/runtime-stress.md 2>/dev/null || true
          cp "$MCMS_AUDIT_OUTPUT/preflight-time.txt" docs/audits/issue-567/preflight-time.txt 2>/dev/null || true
          cp "$MCMS_AUDIT_OUTPUT/preflight-repeat-time.txt" docs/audits/issue-567/preflight-repeat-time.txt 2>/dev/null || true
          cp "$MCMS_AUDIT_OUTPUT/runtime-stress-time.txt" docs/audits/issue-567/runtime-stress-time.txt 2>/dev/null || true
          cp "$MCMS_AUDIT_OUTPUT/final-status.txt" docs/audits/issue-567/final-status.txt

          rm -f "$AUDIT_WORKFLOW"
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git commit -m "Record Issue #567 full production-health audit evidence"
          git push --force-with-lease="refs/heads/${AUDIT_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:${AUDIT_BRANCH}"
          exit "$status"

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolkit-v8-2-0-full-production-health-${{ github.sha }}
          path: ${{ runner.temp }}/audit-output
          if-no-files-found: error
          retention-days: 90
