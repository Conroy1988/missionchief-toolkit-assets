name: GitHub Actions Security Audit

run-name: Actions security · ${{ github.event_name }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions-security-policy.json"
      - ".github/dependabot.yml"
      - ".github/scripts/audit_actions_security.py"
      - ".github/workflows/**"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit action pinning and permissions
        run: |
          python3 .github/scripts/audit_actions_security.py

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-actions-security-audit
          path: |
            actions-security-report.json
            actions-security-report.md
          if-no-files-found: error
          retention-days: 7
