name: Build v8 Godfather Interface

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-v8-godfather-architecture.yml"

permissions:
  contents: write

concurrency:
  group: v8-godfather-one-shot-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'Conroy1988' && github.head_ref == 'feat/v8-godfather-an-offer-he-cant-refuse'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact development branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/v8-godfather-an-offer-he-cant-refuse
          fetch-depth: 0
          persist-credentials: true

      - name: Verify isolated branch context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/v8-godfather-an-offer-he-cant-refuse"
          test "$(git remote get-url origin)" = "https://github.com/Conroy1988/missionchief-toolkit-assets"
          git diff --quiet
          git diff --cached --quiet

      - name: Reconstruct deterministic clean-room builder
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v8-godfather/builder-parts/part-*.b64 \
            | tr -d '\n\r ' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/build_v8_godfather.py
          test "$(wc -c < /tmp/build_v8_godfather.py)" = "40582"
          test "$(sha256sum /tmp/build_v8_godfather.py | awk '{print $1}')" = "ecfb156a50357235ac1ca92243cbd0b546744356319cb423c6c659408cbbdd04"
          python3 -m py_compile /tmp/build_v8_godfather.py

      - name: Build and self-clean v8 interface
        shell: bash
        run: python3 /tmp/build_v8_godfather.py --root . --clean-staging

      - name: Remove temporary writer authorisation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/actions-security-policy.json')
          policy = json.loads(path.read_text(encoding='utf-8'))
          removed = policy.get('allowedWritePermissions', {}).pop(
              '.github/workflows/inspect-v8-godfather-architecture.yml', None
          )
          if removed != ['contents']:
              raise SystemExit(f'Unexpected temporary writer policy: {removed!r}')
          path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Record reviewed v8 source budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/fixtures/main-style-source-headroom.json')
          fixture = json.loads(path.read_text(encoding='utf-8'))
          fixture['v8Candidate'] = {
              'issue': 533,
              'version': '8.0.0',
              'sourceBytes': 1600028,
              'sourceLines': 24100,
              'sourceSha256': '049a0a0003dc28a1acabbb3a39958c01081deaa4032b48cedae97e9fc90d4d5b',
              'templateBytes': 679313,
              'templateLines': 7769,
              'templateSha256': '16cfb67472e02fb1c187144c078591b79553fe9deaa633067ae59fea1c1863ab',
              'canonicalCssSha256': '494b03f1a5b3571ba51105c009dbcde4f29f1458b15beeb6f2440b55db855f48',
              'maxSourceBytes': 1650000,
              'maxSourceLines': 24500,
              'minTemplateBytes': 500000,
              'baseline': 'v7Candidate',
              'approvedGrowth': {
                  'sourceBytes': 35131,
                  'sourceLines': 517,
                  'templateBytes': 32470,
                  'templateLines': 489
              },
              'scope': 'Issue #533 complete eighth interface system, original theme assets and theme-scoped payout integration'
          }
          path.write_text(json.dumps(fixture, indent=2) + '\n', encoding='utf-8')
          PY
          cat > .github/scripts/test_main_style_source_headroom.py <<'PY'
          #!/usr/bin/env python3
          import hashlib
          import json
          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          text = (ROOT / 'src' / 'MissionChief_Map_Command_Toolkit.user.js').read_text(encoding='utf-8')
          fixture = json.loads((ROOT / '.github/fixtures/main-style-source-headroom.json').read_text(encoding='utf-8'))
          candidate = fixture['v8Candidate']
          start = text.index('function installMainStyles()')
          template_start = text.index('addStyle(`', start) + len('addStyle(`')
          metric = text.index("recordStartupMetric('stylesheetInstallMs'", template_start)
          template_end = text.rfind('`);', template_start, metric)
          raw = text[template_start:template_end]
          lines = raw.split('\n')
          canonical = re.sub(
              r'\n[\t ]*}',
              '}',
              '\n'.join(
                  line
                  for index, line in enumerate(lines)
                  if not (0 < index < len(lines) - 1 and not line.strip())
              ),
          )
          actual = {
              'sourceBytes': len(text.encode()),
              'sourceLines': len(text.splitlines()),
              'sourceSha256': hashlib.sha256(text.encode()).hexdigest(),
              'templateBytes': len(raw.encode()),
              'templateLines': len(lines),
              'templateSha256': hashlib.sha256(raw.encode()).hexdigest(),
              'canonicalCssSha256': hashlib.sha256(canonical.encode()).hexdigest(),
          }
          assert all(actual[key] == candidate[key] for key in actual), (actual, candidate)
          assert actual['sourceBytes'] <= candidate['maxSourceBytes'], (actual, candidate)
          assert actual['sourceLines'] <= candidate['maxSourceLines'], (actual, candidate)
          assert actual['templateBytes'] >= candidate['minTemplateBytes'], (actual, candidate)
          print('Main-style source-headroom contract passed for v8.')
          PY
          chmod +x .github/scripts/test_main_style_source_headroom.py
          cat > .github/scripts/test_issue464_launcher_settings_contract.py <<'PY'
          #!/usr/bin/env python3
          import json
          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          text = (ROOT / 'src' / 'MissionChief_Map_Command_Toolkit.user.js').read_text(encoding='utf-8')
          fixture = json.loads((ROOT / '.github/fixtures/main-style-source-headroom.json').read_text(encoding='utf-8'))
          line_limit = fixture['v8Candidate']['maxSourceLines']

          def section(start, end):
              first = text.index(start)
              last = text.index(end, first)
              return text[first:last]

          control = section('    function createControl(', '    function createPanel(')
          assert 'const primaryMap = toolkitPrimaryMapElement(mapEl, document);' in control
          ensure = section('    function ensureUi()', '    function mutationBelongsToToolkit')
          assert 'return Boolean(control || document.getElementById(SCRIPT.controlId));' in ensure
          boot = section('    function boot()', '    function scheduleBoot()')
          assert 'installMissionMarkerAddHook' in boot
          assert 'installCustomVehicleBadges' in boot
          assert 'installOperationalSuiteShell' not in boot
          age = section('    function updateMissionAgeLabels()', '    function scheduleMissionAgeRefresh(')
          assert 'missionAgeRefreshPlan' in age
          metadata = re.search(r'^//\s*@version\s+([^\s]+)', text, re.M).group(1)
          runtime = re.search(r"version:\s*'([^']+)'", text).group(1)
          assert metadata == runtime
          assert tuple(int(part) for part in metadata.split('.')[:3]) >= (8, 0, 0)
          assert len(text.splitlines()) <= line_limit
          print('v8 launcher, boot and Mission Age contract passed.')
          PY
          chmod +x .github/scripts/test_issue464_launcher_settings_contract.py

      - name: Validate generated JavaScript and Godfather contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          python3 .github/scripts/test_v8_godfather_contract.py
          python3 -m json.tool themes/godfather/manifest.json >/dev/null
          python3 -m json.tool docs/site-data.json >/dev/null
          python3 -m json.tool help/manifest.json >/dev/null
          python3 -m json.tool status/theme-asset-inventory.json >/dev/null
          python3 -m json.tool status/media-asset-audit.json >/dev/null
          python3 -m json.tool .github/asset-compatibility-aliases.json >/dev/null
          python3 -m json.tool .github/fixtures/main-style-source-headroom.json >/dev/null

      - name: Validate asset health contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v8-validation
          python3 .github/scripts/test_asset_health.py 2>&1 | tee /tmp/v8-validation/asset-health.log

      - name: Validate main-style source headroom
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v8-validation
          python3 .github/scripts/test_main_style_source_headroom.py 2>&1 | tee /tmp/v8-validation/main-style-headroom.log

      - name: Run canonical userscript preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v8-validation
          bash .github/scripts/run_userscript_preflight.sh 2>&1 | tee /tmp/v8-validation/userscript-preflight.log
          python3 .github/scripts/validate_userscript.py 2>&1 | tee /tmp/v8-validation/validate-userscript.log
          git restore --worktree --staged -- dist || true
          git clean -fd -- dist

      - name: Preserve validation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-godfather-validation-${{ github.sha }}
          path: /tmp/v8-validation
          if-no-files-found: warn
          retention-days: 7

      - name: Verify staging teardown and generated scope
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/v8-godfather
          test ! -e .github/workflows/inspect-v8-godfather-architecture.yml
          test -f .github/scripts/test_v8_godfather_contract.py
          test -f themes/godfather/manifest.json
          test -f themes/godfather/audio/godfather-flash-payout.mp3
          test "$(sha256sum src/MissionChief_Map_Command_Toolkit.user.js | awk '{print $1}')" = "049a0a0003dc28a1acabbb3a39958c01081deaa4032b48cedae97e9fc90d4d5b"
          test "$(sha256sum themes/godfather/audio/godfather-flash-payout.mp3 | awk '{print $1}')" = "6ac631584e9df05ff821a6203ee24d1a6df7cf84d4f946713145a4b3f9502d45"
          git status --short
          test -n "$(git status --porcelain)"

      - name: Commit exact generated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes found"
            exit 1
          fi
          git commit -m "Implement v8.0.0 Godfather interface"
          git push origin HEAD:feat/v8-godfather-an-offer-he-cant-refuse
