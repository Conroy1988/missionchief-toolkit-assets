<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">MissionChief Toolkit cinematic emergency systems board</title>
<desc id="desc">Emergency systems board for Toolkit v7.1.4 showing incident, mission, fleet, map, financial and transport command systems.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020508"/><stop offset=".5" stop-color="#07131b"/><stop offset="1" stop-color="#12080a"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#253139"/><stop offset=".2" stop-color="#10171c"/><stop offset=".8" stop-color="#070b0e"/><stop offset="1" stop-color="#1e2930"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#d5d8d8"/><stop offset="1" stop-color="#7d8588"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe59a"/><stop offset=".5" stop-color="#f0b83f"/><stop offset="1" stop-color="#8b5207"/></linearGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#75d6ff" stroke-opacity=".04"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#fff" opacity=".017"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".72"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1800" height="1000" rx="26" fill="url(#bg)"/><rect width="1800" height="1000" rx="26" fill="url(#grid)"/><rect width="1800" height="1000" rx="26" fill="url(#scan)"/><rect x="3" y="3" width="1794" height="994" rx="23" fill="none" stroke="#3e5360" stroke-width="5"/>
