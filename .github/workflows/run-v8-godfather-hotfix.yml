name: Run v8.0.1 Godfather Hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-v8-godfather-hotfix.yml"
      - ".github/workflows/run-v8-godfather-hotfix-v2.yml"
      - ".github/actions-security-policy.json"

permissions:
  contents: write

concurrency:
  group: v8-0-1-godfather-hotfix-runner
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'Conroy1988' && github.head_ref == 'hotfix/v8.0.1-godfather-css-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: hotfix/v8.0.1-godfather-css-activation
          fetch-depth: 0
          persist-credentials: true

      - name: Execute direct repair and install regression
        id: execute
        shell: bash
        run: |
          set +e
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee v8-hotfix-execution.log
          from pathlib import Path

          def strip_block_indent(lines):
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          path = Path('.github/workflows/run-v8-godfather-hotfix-v2.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          python_blocks = []
          index = 0
          while index < len(lines):
              if lines[index].strip() == "python3 - <<'PY'":
                  body = []
                  index += 1
                  while index < len(lines) and lines[index].strip() != 'PY':
                      body.append(lines[index])
                      index += 1
                  python_blocks.append(strip_block_indent(body))
              index += 1
          if len(python_blocks) != 2:
              raise SystemExit(f'Expected two direct Python blocks, found {len(python_blocks)}')

          exec(compile(python_blocks[0], 'v8-hotfix-direct-repair', 'exec'), {})

          start = next(i for i, line in enumerate(lines) if "cat > .github/scripts/test_issue537_godfather_css_activation.py <<'PY'" in line)
          body = []
          index = start + 1
          while index < len(lines) and lines[index].strip() != 'PY':
              body.append(lines[index])
              index += 1
          target = Path('.github/scripts/test_issue537_godfather_css_activation.py')
          target.write_text(strip_block_indent(body), encoding='utf-8')
          target.chmod(0o755)

          exec(compile(python_blocks[1], 'v8-hotfix-cleanup', 'exec'), {})
          PY
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve execution diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-godfather-hotfix-execution
          path: v8-hotfix-execution.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on execution failure
        if: steps.execute.outputs.exit_code != '0'
        run: |
          cat v8-hotfix-execution.log
          exit 1

      - name: Validate exact repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          python3 -m py_compile .github/scripts/test_issue537_godfather_css_activation.py
          python3 .github/scripts/test_issue537_godfather_css_activation.py
          python3 .github/scripts/test_v8_godfather_contract.py
          python3 .github/scripts/test_main_style_source_headroom.py
          bash .github/scripts/run_userscript_preflight.sh
          python3 .github/scripts/validate_userscript.py
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          test ! -e .github/workflows/hotfix-v8-godfather-css.yml
          test ! -e .github/workflows/run-v8-godfather-hotfix.yml
          test ! -e .github/workflows/run-v8-godfather-hotfix-v2.yml

      - name: Commit exact v8.0.1 hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Conroy1988'
          git config user.email '27301455+Conroy1988@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Godfather stylesheet activation for v8.0.1'
          git push origin HEAD:hotfix/v8.0.1-godfather-css-activation
