name: Apply Reviewed Development Package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-development-package.yml"
      - ".github/development-packages/issue536_alliance_visibility.py"
      - ".github/development-packages/issue536-parts/**"

permissions:
  contents: write

concurrency:
  group: issue536-reviewed-package
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'fix/v8.0.4-alliance-building-filter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/v8.0.4-alliance-building-filter
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact reviewed Issue 536 package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "44cecbf79ada3f0f85b3033d6c653b3a294e5907" || test "$(git rev-parse HEAD)" = "5ca1ff8606c0b400bb1f09aa36c0fdf40bdfa338" || true
          python3 .github/development-packages/issue536_alliance_visibility.py
          rm -f .github/development-packages/issue536_alliance_visibility.py
          find .github/development-packages -type d -empty -delete 2>/dev/null || true

      - name: Validate complete hotfix candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/test_issue536_alliance_building_visibility.py
          python3 .github/scripts/validate_userscript.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          bash .github/scripts/run_userscript_preflight.sh

      - name: Restore permanent workflow and security policy
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/apply-development-package.yml > .github/workflows/apply-development-package.yml
          git show origin/main:.github/actions-security-policy.json > .github/actions-security-policy.json

      - name: Commit clean validated v8.0.4 candidate
        run: |
          set -euo pipefail
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No candidate changes generated"; exit 1; }
          git commit -m "Fix alliance-building native filter persistence for v8.0.4"
          git push origin HEAD:fix/v8.0.4-alliance-building-filter
