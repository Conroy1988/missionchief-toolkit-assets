<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">MissionChief Map Command Toolkit emergency control board</title><desc id="desc">A retro emergency-services control board showing mission, fleet, map, finance, interfaces, device support and verified release chain.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04070a"/><stop offset=".52" stop-color="#0a151b"/><stop offset="1" stop-color="#160b0d"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".095"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#27b7ff"/><stop offset=".49" stop-color="#76dcff"/><stop offset=".51" stop-color="#ff8175"/><stop offset="1" stop-color="#d92835"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9ee5ff" stroke-opacity=".032"/></pattern><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#fff" opacity=".012"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity=".45"/></filter></defs><rect width="1600" height="900" rx="34" fill="url(#bg)"/><rect width="1600" height="900" rx="34" fill="url(#grid)"/><rect width="1600" height="900" rx="34" fill="url(#scan)"/><rect x="2" y="2" width="1596" height="896" rx="32" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="72" y="72" fill="#fff" font-family="Arial Black,Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" letter-spacing=".7">EMERGENCY COMMAND BOARD</text><text x="72" y="105" fill="#8ea1ab" font-family="Courier New,monospace" font-size="14" font-weight="700">MISSIONCHIEF MAP COMMAND TOOLKIT // VERIFIED v7.1.3 // CALLSIGN MC-UK</text><rect x="72" y="130" width="1456" height="5" rx="2.5" fill="url(#edge)"/><g transform="translate(72 164)"><rect width="342" height="78" rx="16" fill="url(#glass)" stroke="#27b7ff" stroke-opacity=".24"/><text x="24" y="29" fill="#8be1ff" font-family="Courier New,monospace" font-size="11" font-weight="900" letter-spacing="1.7">CURRENT RELEASE</text><text x="24" y="60" fill="#fff" font-size="26" font-weight="900">v7.1.3</text><rect x="366" width="342" height="78" rx="16" fill="url(#glass)" stroke="#e13d48" stroke-opacity=".24"/><text x="390" y="29" fill="#ffabb2" font-family="Courier New,monospace" font-size="11" font-weight="900" letter-spacing="1.7">INCIDENT COMMAND</text><text x="390" y="60" fill="#fff" font-size="22" font-weight="900">Continuous Wire</text><rect x="732" width="342" height="78" rx="16" fill="url(#glass)" stroke="#f0b54d" stroke-opacity=".24"/><text x="756" y="29" fill="#ffe29a" font-family="Courier New,monospace" font-size="11" font-weight="900" letter-spacing="1.7">INTERFACE SYSTEMS</text><text x="756" y="60" fill="#fff" font-size="26" font-weight="900">7</text><rect x="1098" width="358" height="78" rx="16" fill="url(#glass)" stroke="#75c864" stroke-opacity=".24"/><text x="1122" y="29" fill="#b8ebaa" font-family="Courier New,monospace" font-size="11" font-weight="900" letter-spacing="1.7">SUPPORTED MODES</text><text x="1122" y="60" fill="#fff" font-size="20" font-weight="900">Desktop · Tablet · iOS</text></g><g transform="translate(72 272)" filter="url(#shadow)"><rect width="704" height="230" rx="22" fill="#0d202b" stroke="#27b7ff" stroke-opacity=".30"/><circle cx="30" cy="34" r="7" fill="#27b7ff"/><text x="50" y="40" fill="#8be1ff" font-family="Courier New,monospace" font-size="12" font-weight="900" letter-spacing="2">MISSION CONTROL</text><text x="28" y="82" fill="#fff" font-size="24" font-weight="900">Priority, age and value at a glance</text><g fill="#d3e0e6" font-size="14"><text x="30" y="122">• Continuous Incident Command Wire and expanded queue</text><text x="30" y="153">• Mission Age map timers and shortcut 6</text><text x="30" y="184">• Mission Value, Unit Commitment and Transport Watcher</text><text x="30" y="215">• Direct click-to-zoom navigation without replacing native windows</text></g><rect x="728" width="728" height="230" rx="22" fill="#142b1a" stroke="#75c864" stroke-opacity=".30"/><circle cx="758" cy="34" r="7" fill="#75c864"/><text x="778" y="40" fill="#b8ebaa" font-family="Courier New,monospace" font-size="12" font-weight="900" letter-spacing="2">FLEET + TRANSPORT</text><text x="756" y="82" fill="#fff" font-size="24" font-weight="900">Identity, availability and bounded action</text><g fill="#d8e6d3" font-size="14"><text x="758" y="122">• Vehicle Code Status and Own Vehicle Category badges</text><text x="758" y="153">• Resource Gap against nearby personal vehicle availability</text><text x="758" y="184">• Native auto-load and guarded Patient Transport Sweep</text><text x="758" y="215">• Ownership checks, confirmation evidence and idempotent counters</text></g></g><g transform="translate(72 526)" filter="url(#shadow)"><rect width="704" height="216" rx="22" fill="#332a16" stroke="#f0b54d" stroke-opacity=".30"/><circle cx="30" cy="34" r="7" fill="#f0b54d"/><text x="50" y="40" fill="#ffe29a" font-family="Courier New,monospace" font-size="12" font-weight="900" letter-spacing="2">MAP + PLACE CONTROL</text><text x="28" y="82" fill="#fff" font-size="24" font-weight="900">Geography converted into operational context</text><g fill="#e8dfc6" font-size="14"><text x="30" y="122">• Coverage rings around selected locations</text><text x="30" y="153">• Smart Bookmark Labels, pins and touch previews</text><text x="30" y="184">• Profiles, focus layouts and responsive command modes</text></g><rect x="728" width="728" height="216" rx="22" fill="#35171d" stroke="#e13d48" stroke-opacity=".30"/><circle cx="758" cy="34" r="7" fill="#e13d48"/><text x="778" y="40" fill="#ffabb2" font-family="Courier New,monospace" font-size="12" font-weight="900" letter-spacing="2">FINANCIAL CONTROL</text><text x="756" y="82" fill="#fff" font-size="24" font-weight="900">Performance reconciled without invented certainty</text><g fill="#ead5d9" font-size="14"><text x="758" y="122">• Alliance Credits and eligibility-aware filtering</text><text x="758" y="153">• Revenue, spending, payout and variance evidence</text><text x="758" y="184">• Saved Discord webhook reports and reduced-motion controls</text></g></g><g transform="translate(72 770)"><rect width="1456" height="76" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".11"/><text x="24" y="28" fill="#9eb0ba" font-family="Courier New,monospace" font-size="11" font-weight="900" letter-spacing="1.8">VERIFIED DELIVERY CHAIN</text><text x="24" y="56" fill="#fff" font-size="14" font-weight="800">Canonical source → exact validation artefact → release-state ledger → stable distribution → GitHub Release → Greasy Fork → private backup → Discord confirmation</text></g></g><rect y="890" width="800" height="10" fill="#27b7ff"/><rect x="800" y="890" width="800" height="10" fill="#d92835"/></svg>