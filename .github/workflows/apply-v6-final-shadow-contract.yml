name: Apply v6 Final Shadow Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/v6-reconcile/fix_v6_shadow_candidate_contract.py"
      - ".github/workflows/apply-v6-final-shadow-contract.yml"

permissions:
  contents: read

concurrency:
  group: toolkit-v6-final-shadow-contract
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'Conroy1988' && github.head_ref == 'feat/issue-510-v6-performance-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact v6 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/issue-510-v6-performance-overhaul
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and validate candidate-aware shadow parity
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/v6-reconcile/fix_v6_shadow_candidate_contract.py
          python3 .github/scripts/test_shadow_branch_parity.py
          python3 -m py_compile .github/scripts/verify_shadow_branch_parity.py

      - name: Remove one-use applicator
        run: |
          rm -f .github/v6-reconcile/fix_v6_shadow_candidate_contract.py
          rm -f .github/workflows/apply-v6-final-shadow-contract.yml
          rmdir .github/v6-reconcile 2>/dev/null || true

      - name: Commit exact final shadow contract
        env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_PR_TOKEN"
          test "$GITHUB_HEAD_REF" = "feat/issue-510-v6-performance-overhaul"
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A -- \
            .github/scripts/verify_shadow_branch_parity.py \
            .github/workflows/verify-shadow-branch-parity.yml \
            .github/scripts/test_shadow_branch_parity.py \
            .github/v6-reconcile/fix_v6_shadow_candidate_contract.py \
            .github/workflows/apply-v6-final-shadow-contract.yml
          git diff --cached --quiet && { echo "No final shadow contract change required."; exit 0; }
          git commit -m "Make shadow parity candidate-aware"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/feat/issue-510-v6-performance-overhaul
