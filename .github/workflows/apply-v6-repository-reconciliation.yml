name: Apply v6 Repository Reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/v6-reconcile/**"
      - ".github/workflows/apply-v6-repository-reconciliation.yml"

permissions:
  contents: write

concurrency:
  group: toolkit-v6-repository-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor == 'Conroy1988' && github.head_ref == 'feat/issue-510-v6-performance-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact v6 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/issue-510-v6-performance-overhaul
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile v6 repository surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/v6-reconcile/patch_v6_repository.py
          python3 .github/scripts/test_settings_ui_contract.py
          python3 .github/scripts/test_boot_lifecycle_contract.py
          python3 .github/scripts/check_documentation_drift.py --allow-release-candidate
          python3 .github/scripts/validate_userscript.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent src/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt

      - name: Commit reconciled candidate files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CHANGELOG.md README.md help/index.html docs/site-data.json \
            docs/greasyfork-description.md docs/media/readme-hero.svg \
            .github/documentation-contract.json \
            .github/fixtures/settings-ui-contract.json \
            .github/fixtures/boot-lifecycle-contract.json \
            dist/MissionChief_Map_Command_Toolkit.user.js \
            dist/MissionChief_Map_Command_Toolkit.txt \
            dist/SHA256SUMS.txt dist/release-manifest.json
          git diff --cached --quiet && { echo "::error::No v6 reconciliation change was produced."; exit 1; }
          git commit -m "Reconcile v6.0.0 candidate documentation and distribution"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/feat/issue-510-v6-performance-overhaul
