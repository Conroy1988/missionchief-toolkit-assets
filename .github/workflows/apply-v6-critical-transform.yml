name: Apply v6 Critical Source Transform

on:
  push:
    branches:
      - feat/issue-510-v6-performance-overhaul
    paths:
      - ".github/v6-transform/**"
      - ".github/workflows/apply-v6-critical-transform.yml"

permissions:
  contents: write

concurrency:
  group: toolkit-v6-critical-source-transform
  cancel-in-progress: false

jobs:
  transform:
    if: github.actor == 'Conroy1988' && github.ref == 'refs/heads/feat/issue-510-v6-performance-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact v6 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/issue-510-v6-performance-overhaul
          fetch-depth: 0
          persist-credentials: false

      - name: Apply deterministic v6 transform
        shell: bash
        run: |
          set -euo pipefail
          cp src/MissionChief_Map_Command_Toolkit.user.js /tmp/v6-phase1.user.js
          python3 .github/v6-transform/patch_v6_phase1.py
          python3 .github/v6-transform/patch_v6_retire.py
          python3 .github/v6-transform/prune_v6_css.py
          python3 .github/v6-transform/patch_v6_cleanup.py
          python3 .github/v6-transform/patch_v6_residual.py
          python3 .github/v6-transform/patch_v6_operational_registry.py
          python3 .github/v6-transform/patch_v6_observer_scope.py
          python3 .github/v6-transform/patch_v6_settings_accuracy.py
          python3 .github/v6-transform/patch_v6_final.py
          cp /tmp/v6-phase1.user.js src/MissionChief_Map_Command_Toolkit.user.js
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          test "$(sed -nE 's|^//[[:space:]]*@version[[:space:]]+(.+)$|\1|p' src/MissionChief_Map_Command_Toolkit.user.js | head -n1 | xargs)" = "6.0.0"
          python3 .github/scripts/test_v6_feature_retirement.py
          python3 .github/scripts/test_v6_mission_age_retention.py
          python3 .github/scripts/test_v6_operational_settings_contract.py
          python3 .github/scripts/test_v6_operational_runtime_budget.py >/tmp/v6-budget.json

      - name: Commit transformed source only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/MissionChief_Map_Command_Toolkit.user.js
          git diff --cached --quiet && { echo "::error::The deterministic v6 transform produced no source change."; exit 1; }
          CHANGED="$(git diff --cached --name-only)"
          test "$CHANGED" = "src/MissionChief_Map_Command_Toolkit.user.js"
          git commit -m "Apply v6.0.0 critical performance source transform"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/feat/issue-510-v6-performance-overhaul
