<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">MissionChief Toolkit cinematic release and recovery control board</title>
<desc id="desc">Verified Toolkit v7.1.4 release chain from canonical source through validation, distribution, private recovery and announcement.</desc>
<defs>
