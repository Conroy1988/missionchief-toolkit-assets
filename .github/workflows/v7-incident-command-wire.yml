name: Validate Incident Command Wire

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/test_issue517_incident_command_wire.py
      - run: python3 .github/scripts/test_issue564_incident_feed_attended.py
      - run: node .github/scripts/test_issue517_incident_command_wire_runtime.js
      - run: node .github/scripts/test_issue564_incident_feed_attended_runtime.js
      - run: node --check src/MissionChief_Map_Command_Toolkit.user.js
      - run: cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
