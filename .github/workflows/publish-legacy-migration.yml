name: Publish final userscript migration notice
on:
  push:
    branches: [main]
    paths:
      - legacy/publish-migration.py
      - .github/workflows/publish-legacy-migration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolkit-final-userscript-migration
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and validate the final notice
        run: |
          npm ci --prefix extension/home-response
          python3 legacy/build-migration.py
          node --check .dev/legacy-migration/MissionChief_Map_Command_Toolkit.user.js
          node --test legacy/migration-notice.test.mjs
          python3 -m py_compile legacy/publish-migration.py
      - name: Publish complete release and verify TKB endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 legacy/publish-migration.py
      - name: Preserve delivery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-userscript-migration-${{ github.sha }}
          path: .dev/legacy-migration/
          if-no-files-found: error
          retention-days: 90
