name: Materialise v8 Godfather Development Inputs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/v8-godfather/**"
      - ".github/workflows/inspect-v8-godfather-architecture.yml"

permissions:
  contents: read

jobs:
  materialise:
    if: github.actor == 'Conroy1988' && github.head_ref == 'feat/v8-godfather-an-offer-he-cant-refuse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact v8 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/v8-godfather-an-offer-he-cant-refuse
          fetch-depth: 1
          persist-credentials: false

      - name: Extract theme and payout architecture
        run: python3 .github/v8-godfather/inspect_architecture.py

      - name: Audit staged builder and payout-audio transports
        id: materialise
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8-materialised

          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import traceback
          from pathlib import Path

          output = Path('v8-materialised')
          report: dict[str, object] = {'sourceCommit': '${{ github.sha }}'}
          failures: list[str] = []

          def read_parts(directory: Path) -> tuple[list[Path], list[str]]:
              parts = sorted(directory.glob('part-*.b64'))
              if not parts:
                  raise RuntimeError(f'No transport parts found in {directory}')
              texts = [''.join(path.read_text(encoding='utf-8').split()) for path in parts]
              report[str(directory)] = [
                  {
                      'name': path.name,
                      'fileBytes': path.stat().st_size,
                      'base64Chars': len(text),
                      'mod4': len(text) % 4,
                      'head': text[:16],
                      'tail': text[-16:],
                  }
                  for path, text in zip(parts, texts, strict=True)
              ]
              return parts, texts

          def decode_continuous(texts: list[str]) -> bytes:
              joined = ''.join(texts)
              joined += '=' * ((-len(joined)) % 4)
              return base64.b64decode(joined, validate=True)

          try:
              builder_parts, builder_texts = read_parts(Path('.github/v8-godfather/builder-parts'))
              builder_transport = decode_continuous(builder_texts)
              try:
                  builder_payload = gzip.decompress(builder_transport)
                  (output / 'staged-v8-builder.py').write_bytes(builder_payload)
                  report['builder'] = {
                      'status': 'valid',
                      'bytes': len(builder_payload),
                      'sha256': hashlib.sha256(builder_payload).hexdigest(),
                  }
              except Exception as error:
                  report['builder'] = {
                      'status': 'abandoned-malformed-staging-payload',
                      'transportBytes': len(builder_transport),
                      'transportSha256': hashlib.sha256(builder_transport).hexdigest(),
                      'error': repr(error),
                      'decision': 'Replace with a clean-room deterministic builder based on verified v7.1.6.',
                  }
          except Exception as error:
              report['builder'] = {'status': 'decode-failed', 'error': repr(error)}

          try:
              audio_parts, audio_texts = read_parts(Path('.github/v8-godfather/audio-parts'))
              attempts: list[dict[str, object]] = []
              audio_payload: bytes | None = None
              try:
                  audio_payload = decode_continuous(audio_texts)
                  attempts.append({'mode': 'continuous', 'ok': True, 'bytes': len(audio_payload)})
              except Exception as error:
                  attempts.append({'mode': 'continuous', 'ok': False, 'error': repr(error)})

              if audio_payload is None:
                  try:
                      chunks = []
                      for text in audio_texts:
                          padded = text + ('=' * ((-len(text)) % 4))
                          chunks.append(base64.b64decode(padded, validate=True))
                      audio_payload = b''.join(chunks)
                      attempts.append({
                          'mode': 'independent-padded',
                          'ok': True,
                          'bytes': len(audio_payload),
                          'partBytes': [len(chunk) for chunk in chunks],
                      })
                  except Exception as error:
                      attempts.append({'mode': 'independent-padded', 'ok': False, 'error': repr(error)})

              report['audioDecodeAttempts'] = attempts
              if audio_payload is None:
                  raise RuntimeError('All payout-audio transport decode modes failed')

              audio = output / 'godfather-flash-payout.mp3'
              audio.write_bytes(audio_payload)
              report['audio'] = {
                  'status': 'decoded',
                  'bytes': len(audio_payload),
                  'sha256': hashlib.sha256(audio_payload).hexdigest(),
                  'head': audio_payload[:16].hex(),
                  'tail': audio_payload[-16:].hex(),
              }
              if len(audio_payload) < 32_000:
                  raise RuntimeError(f'Godfather payout audio is unexpectedly small: {len(audio_payload)} bytes')
              if not (audio_payload.startswith(b'ID3') or audio_payload[:2] in {b'\xff\xfb', b'\xff\xf3', b'\xff\xf2'}):
                  raise RuntimeError('Godfather payout audio does not have an MP3 signature')
          except Exception as error:
              failures.append(f'audio: {type(error).__name__}: {error}')
              report['audioFailure'] = {
                  'error': repr(error),
                  'traceback': traceback.format_exc(),
              }
          finally:
              report['failures'] = failures
              (output / 'materialisation-report.json').write_text(
                  json.dumps(report, indent=2) + '\n', encoding='utf-8'
              )

          if failures:
              raise SystemExit('; '.join(failures))
          PY

          if [ -f v8-materialised/godfather-flash-payout.mp3 ] && command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error \
              -show_entries format=duration,size,bit_rate:stream=codec_name,channels,sample_rate \
              -of json \
              v8-materialised/godfather-flash-payout.mp3 \
              > v8-materialised/audio-probe.json || true
          fi

      - name: Stage exact development inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8-inputs/.github/scripts v8-inputs/.github/fixtures v8-inputs/docs v8-inputs/help v8-inputs/status v8-inputs/themes
          cp src/MissionChief_Map_Command_Toolkit.user.js v8-inputs/source.user.js
          cp CHANGELOG.md README.md v8-inputs/
          cp help/index.html help/manifest.json v8-inputs/help/
          cp docs/site-data.json v8-inputs/docs/
          cp status/theme-asset-inventory.json status/media-asset-audit.json v8-inputs/status/
          cp .github/scripts/validate_userscript.py .github/scripts/test_asset_health.py .github/scripts/test_main_style_source_headroom.py .github/scripts/run_userscript_preflight.sh v8-inputs/.github/scripts/
          cp .github/fixtures/main-style-source-headroom.json v8-inputs/.github/fixtures/
          cp -R themes/* v8-inputs/themes/

      - name: Upload architecture, exact inputs and transport evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-godfather-materialised-${{ github.sha }}
          path: |
            v8-godfather-architecture.txt
            v8-inputs
            v8-materialised
          if-no-files-found: error
          retention-days: 14

      - name: Enforce valid payout audio
        if: steps.materialise.outcome != 'success'
        run: |
          cat v8-materialised/materialisation-report.json || true
          exit 1
