<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title"><title id="title">Toolkit Operations — build, switch and upgrade</title><rect width="1600" height="460" rx="20" fill="#0c0e13"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="60" fill="#a4aebf" font-size="17" letter-spacing="4">OPERATIONS / THREE WAYS TO MOVE FORWARD</text><rect x="40" y="94" width="500" height="260" rx="12" fill="#151820" stroke="#282d38"/><rect x="65" y="124" width="4" height="34" fill="#f43d50"/><text x="84" y="150" fill="#f43d50" font-size="23">01</text><text x="65" y="218" fill="#fff" font-size="47" font-weight="700">BUILD</text><text x="65" y="268" fill="#d0d6e0" font-size="17" font-weight="700">HOME RESPONSE BUILDER</text><text x="65" y="309" fill="#9aa5b7" font-size="18">Plan coverage. Place your next response.</text><rect x="560" y="94" width="500" height="260" rx="12" fill="#151820" stroke="#282d38"/><rect x="585" y="124" width="4" height="34" fill="#f43d50"/><text x="604" y="150" fill="#f43d50" font-size="23">02</text><text x="585" y="218" fill="#fff" font-size="47" font-weight="700">SWITCH</text><text x="585" y="268" fill="#d0d6e0" font-size="17" font-weight="700">HOME RESPONSE UNIT SWITCHER</text><text x="585" y="309" fill="#9aa5b7" font-size="18">Choose the type. Refresh your fleet.</text><rect x="1080" y="94" width="500" height="260" rx="12" fill="#151820" stroke="#282d38"/><rect x="1105" y="124" width="4" height="34" fill="#f43d50"/><text x="1124" y="150" fill="#f43d50" font-size="23">03</text><text x="1105" y="218" fill="#fff" font-size="47" font-weight="700">UPGRADE</text><text x="1105" y="268" fill="#d0d6e0" font-size="17" font-weight="700">HOSPITAL UPGRADES</text><text x="1105" y="309" fill="#9aa5b7" font-size="18">Choose a target. Expand capacity.</text><text x="800" y="409" fill="#aab4c3" font-size="19" text-anchor="middle">REVIEW THE SCOPE   /   CONFIRM THE COST   /   VERIFY THE RESULT</text></g></svg>