name: Build v8.0.2 Godfather Layout and Audio Hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-v8.0.2-godfather-hotfix.yml"
      - ".github/v8.0.2/**"
      - ".github/actions-security-policy.json"

permissions:
  contents: read

concurrency:
  group: v8-0-2-godfather-layout-audio-hotfix
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'Conroy1988' && github.head_ref == 'hotfix/v8.0.2-godfather-layout-audio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: hotfix/v8.0.2-godfather-layout-audio
          fetch-depth: 0
          persist-credentials: false

      - name: Map every staged audio fragment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          records = []
          for path in sorted(Path('.github/v8.0.2').glob('**/*.b64')):
              value = ''.join(path.read_text(encoding='ascii').split())
              records.append({
                  'path': str(path),
                  'length': len(value),
                  'sha256': hashlib.sha256(value.encode()).hexdigest(),
                  'head': value[:96],
                  'tail': value[-96:],
              })

          # Remove exact duplicates and fragments wholly contained in larger staged fragments.
          values = []
          for record in records:
              value = ''.join(Path(record['path']).read_text(encoding='ascii').split())
              if value and value not in values:
                  values.append(value)
          maximal = [value for value in values if not any(value != other and value in other for other in values)]

          # Greedy overlap assembly, retained only as diagnostic evidence.
          work = maximal[:]
          merges = []
          while len(work) > 1:
              best = None
              for i, left in enumerate(work):
                  for j, right in enumerate(work):
                      if i == j:
                          continue
                      limit = min(len(left), len(right))
                      overlap = 0
                      for size in range(limit, 15, -1):
                          if left[-size:] == right[:size]:
                              overlap = size
                              break
                      if best is None or overlap > best[0]:
                          best = (overlap, i, j)
              if best is None or best[0] < 16:
                  break
              overlap, i, j = best
              left, right = work[i], work[j]
              merged = left + right[overlap:]
              merges.append({'leftLength': len(left), 'rightLength': len(right), 'overlap': overlap, 'mergedLength': len(merged)})
              work = [value for index, value in enumerate(work) if index not in (i, j)] + [merged]

          report = {
              'targetEncodedLength': 181672,
              'targetAudioBytes': 136254,
              'targetAudioSha256': '53160bd03bacf043ea3b0ffbd202163c2621e16a47ecd0f7090bfeacaf00b0d4',
              'records': records,
              'uniqueFragments': len(values),
              'maximalFragments': len(maximal),
              'assembledCandidates': sorted([len(value) for value in work], reverse=True),
              'merges': merges,
          }
          Path('v8-audio-fragment-map.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload fragment map
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-0-2-audio-fragment-map
          path: v8-audio-fragment-map.json
          if-no-files-found: error
          retention-days: 7

      - name: Stop after evidence capture
        run: |
          echo "Audio fragment map captured for exact local reconciliation."
          exit 1
