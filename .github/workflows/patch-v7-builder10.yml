name: Patch v7 Retirement Builder 10
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/v7-retirement/patch_builder10.py"
      - ".github/workflows/patch-v7-builder10.yml"
permissions:
  contents: read
jobs:
  patch:
    if: github.actor == 'Conroy1988' && github.head_ref == 'fix/issue-512-lssm-coexistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/issue-512-lssm-coexistence
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/v7-retirement/patch_builder10.py
      - env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A && git commit -m "Align retained v7 settings panel boundary"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" push origin HEAD:refs/heads/fix/issue-512-lssm-coexistence
