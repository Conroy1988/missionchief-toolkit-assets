name: Build Final Interpolation-Safe Pipeline v4 Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-release-pipeline-v4-candidate-v3.yml"
      - ".github/development-packages/issue543_release_pipeline_v4.py"

permissions:
  contents: read

jobs:
  candidate:
    if: github.head_ref == 'feature/release-pipeline-v4-fast-lane'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialise reviewed Pipeline v4 candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/development-packages/issue543_release_pipeline_v4.py')
          text = path.read_text(encoding='utf-8')
          fixes = (
              ('path.write_text(json.dumps(data,indent=2)+"\\n",encoding="utf-8")',
               'path.write_text(json.dumps(data,indent=2)+"\\\\n",encoding="utf-8")'),
              ('(root/"status/RELEASE_SPEED.md").write_text("\\n".join(lines),encoding="utf-8")',
               '(root/"status/RELEASE_SPEED.md").write_text("\\\\n".join(lines),encoding="utf-8")'),
          )
          for old, new in fixes:
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected embedded escape token count: {old!r} -> {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 .github/development-packages/issue543_release_pipeline_v4.py
          python3 - <<'PY'
          from pathlib import Path

          # Reconcile the permanent version/status contract with Pipeline v4.
          path = Path('.github/scripts/test_version_status_contract.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('- name: Record successful release, manifest and announcement state',
               '- name: Record successful release, manifest, announcement and speed state', 2),
              ('- name: Publish GitHub Pages',
               '- name: Dispatch GitHub Pages asynchronously', 2),
              ('        \'gh run watch "$PAGES_RUN_ID" --exit-status\',\n', '', 1),
          )
          for old, new, expected in replacements:
              if text.count(old) != expected:
                  raise SystemExit(f'Unexpected version-status token count for {old!r}: {text.count(old)}')
              text = text.replace(old, new)
          lines = text.splitlines(keepends=True)
          indexes = [i for i, line in enumerate(lines) if '"PAGES_RUN_ID:' in line]
          if len(indexes) != 1:
              raise SystemExit(f'Unexpected PAGES_RUN_ID marker count: {len(indexes)}')
          expression = '$' + '{{ steps.pages.outputs.dispatched }}'
          lines[indexes[0]] = '        "PAGES_DISPATCHED: ' + expression + '",\n'
          text = ''.join(lines)
          anchor = '        "manifest_run_id",\n'
          if text.count(anchor) != 1:
              raise SystemExit('Unexpected forbidden-marker anchor')
          text = text.replace(anchor, anchor + '        \'gh run watch "$PAGES_RUN_ID" --exit-status\',\n', 1)
          path.write_text(text, encoding='utf-8')

          # Correct generated workflow-text defects without embedding GitHub expressions.
          release_path = Path('.github/workflows/release-toolkit.yml')
          release = release_path.read_text(encoding='utf-8')
          if release.count(chr(1)) != 1:
              raise SystemExit(f'Unexpected metadata-regex control-character count: {release.count(chr(1))}')
          release = release.replace(chr(1), r'\1', 1)
          release_lines = release.splitlines(keepends=True)
          step_indexes = [i for i, line in enumerate(release_lines) if 'Record successful release, manifest, announcement and speed state' in line]
          if len(step_indexes) != 1:
              raise SystemExit(f'Unexpected release-state step count: {len(step_indexes)}')
          step_index = step_indexes[0]
          shell_index = next(i for i in range(step_index + 1, len(release_lines)) if release_lines[i].strip() == 'shell: bash')
          env_indexes = [i for i in range(step_index + 1, shell_index) if release_lines[i].strip() == 'env:']
          if len(env_indexes) != 2:
              raise SystemExit(f'Unexpected release-state env mapping count: {len(env_indexes)}')
          del release_lines[env_indexes[1]]
          for i, line in enumerate(release_lines):
              if 'echo "- ✅ Greasy Fork verification and private backup ran concurrently' in line:
                  release_lines[i] = '            echo "- ✅ Greasy Fork verification and private backup ran concurrently"\n'
              elif 'echo "- ✅ Greasy Fork version verified' in line:
                  release_lines[i] = '            echo "- ✅ Greasy Fork version verified"\n'
              elif 'echo "- ✅ GitHub Pages deployment completed:' in line:
                  release_lines[i] = '            echo "- ✅ GitHub Pages deployment dispatched asynchronously: ${PAGES_DISPATCHED}"\n'
          release = ''.join(release_lines)
          if release.count('echo "- ✅ Greasy Fork verification and private backup ran concurrently"') != 1:
              raise SystemExit('Concurrent-publication summary was not normalised')
          if release.count('echo "- ✅ Greasy Fork version verified"') != 1:
              raise SystemExit('Greasy Fork verification summary was not normalised')
          if release.count('GitHub Pages deployment dispatched asynchronously: ${PAGES_DISPATCHED}') != 1:
              raise SystemExit('Asynchronous Pages summary was not normalised')
          release_path.write_text(release, encoding='utf-8')

          contract_path = Path('.github/scripts/test_release_pipeline_v4.py')
          contract = contract_path.read_text(encoding='utf-8')
          addition = '''\nassert chr(1) not in p\nassert p.count("      - name: Record successful release, manifest, announcement and speed state") == 1\nassert 'echo "- ✅ Greasy Fork verification and private backup ran concurrently"' in p\nassert 'GitHub Pages deployment dispatched asynchronously: ${PAGES_DISPATCHED}' in p\n'''
          if addition.strip() not in contract:
              contract = contract.replace('print("Release Pipeline v4 contract passed.")', addition + '\nprint("Release Pipeline v4 contract passed.")', 1)
          contract_path.write_text(contract, encoding='utf-8')
          PY
          rm -f .github/development-packages/issue543_release_pipeline_v4.py
          rm -f .github/workflows/preflight-release-pipeline-v4.yml
          rm -f .github/workflows/diagnose-release-pipeline-v4.yml
          rm -f .github/workflows/build-release-pipeline-v4-candidate.yml
          rm -f .github/workflows/diagnose-release-pipeline-v4-materialise.yml
          rm -f .github/workflows/build-release-pipeline-v4-candidate-v2.yml
          rm -f .github/workflows/diagnose-release-pipeline-v4-contract-v2.yml
          rm -f .github/workflows/diagnose-release-pipeline-v4-final.yml
          rm -f .github/workflows/build-release-pipeline-v4-candidate-v3.yml
          find .github/development-packages -type d -empty -delete 2>/dev/null || true

      - name: Run complete retained validation
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file) }' \
            .github/workflows/validate-userscript.yml \
            .github/workflows/auto-release-after-validation.yml \
            .github/workflows/release-toolkit.yml
          python3 .github/scripts/test_release_pipeline_v4.py
          python3 .github/scripts/validate_userscript.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          bash .github/scripts/run_userscript_preflight.sh

      - name: Build exact candidate package
        run: |
          set -euo pipefail
          mkdir -p pipeline-v4-candidate
          for file in \
            .github/workflows/validate-userscript.yml \
            .github/workflows/auto-release-after-validation.yml \
            .github/workflows/release-toolkit.yml \
            .github/scripts/run_userscript_preflight.sh \
            .github/scripts/test_version_status_contract.py \
            .github/scripts/record_release_speed.py \
            .github/scripts/generate_release_speed_dashboard.py \
            .github/scripts/test_release_pipeline_v4.py \
            status/release-speed-history.json \
            status/RELEASE_SPEED.md \
            docs/RELEASE_PIPELINE_V4.md; do
            mkdir -p "pipeline-v4-candidate/$(dirname "$file")"
            cp "$file" "pipeline-v4-candidate/$file"
          done
          find pipeline-v4-candidate -type f -print0 | sort -z | xargs -0 sha256sum > pipeline-v4-candidate/SHA256SUMS.txt

      - name: Upload exact validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pipeline-v4-final-${{ github.sha }}
          path: pipeline-v4-candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
