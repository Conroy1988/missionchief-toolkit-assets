<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc"><title id="title">MissionChief Map Command Toolkit native command platform</title><desc id="desc">Native map command, fleet identity, transport support and financial intelligence for MissionChief.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020812"/><stop offset=".55" stop-color="#082237"/><stop offset="1" stop-color="#170b19"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43d8ff"/><stop offset="1" stop-color="#e53b52"/></linearGradient></defs><rect width="1600" height="640" rx="32" fill="url(#bg)"/><rect x="2" y="2" width="1596" height="636" rx="30" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"/><g font-family="Segoe UI,Arial,sans-serif"><text x="80" y="150" fill="#75ddff" font-size="18" font-weight="800" letter-spacing="4">MISSIONCHIEF NATIVE COMMAND</text><text x="76" y="230" fill="#fff" font-size="70" font-weight="900">MAP COMMAND TOOLKIT</text><text x="80" y="292" fill="#ffd178" font-size="30" font-weight="850" letter-spacing="2">THE ONE WE KNEW BEFORE</text><text x="80" y="346" fill="#c6d9e4" font-size="21">Map intelligence · Fleet identity · Native transport · Financial command</text><g transform="translate(80 400)"><rect width="300" height="96" rx="18" fill="#0b3044" stroke="#55d9ff" stroke-opacity=".5"/><text x="24" y="37" fill="#78e3ff" font-size="14" font-weight="850">MISSION COMMAND</text><text x="24" y="68" fill="#fff" font-size="18" font-weight="800">Age · Value · Incidents</text></g><g transform="translate(400 400)"><rect width="300" height="96" rx="18" fill="#162c25" stroke="#62e8ad" stroke-opacity=".45"/><text x="24" y="37" fill="#7cf0bc" font-size="14" font-weight="850">FLEET + TRANSPORT</text><text x="24" y="68" fill="#fff" font-size="18" font-weight="800">Badges · Status · Sweep</text></g><g transform="translate(720 400)