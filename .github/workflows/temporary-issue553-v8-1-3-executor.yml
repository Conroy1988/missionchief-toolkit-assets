name: Temporary Issue 553 v8.1.3 Executor

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: temporary-issue553-v8-1-3
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'Conroy1988/missionchief-toolkit-assets' &&
      github.event.issue.number == 559 &&
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'Conroy1988' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/execute-issue553-v8-1-3 a81c27d7761829ffef0bf395c8183f7ffb155d16'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require owner push token
        env:
          OWNER_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$OWNER_TOKEN" ]] || { echo 'DEVELOPMENT_PR_TOKEN is required.' >&2; exit 1; }

      - name: Check out exact package commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: a81c27d7761829ffef0bf395c8183f7ffb155d16
          fetch-depth: 0
          token: ${{ secrets.DEVELOPMENT_PR_TOKEN }}

      - name: Verify exact PR and default-branch state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh api repos/${GITHUB_REPOSITORY}/pulls/559)"
          test "$(jq -r '.state' <<< "$data")" = 'open'
          test "$(jq -r '.base.ref' <<< "$data")" = 'main'
          test "$(jq -r '.head.ref' <<< "$data")" = 'fix/alliance-member-manager-native-render-v8-1-3'
          test "$(jq -r '.head.sha' <<< "$data")" = 'a81c27d7761829ffef0bf395c8183f7ffb155d16'
          test "$(jq -r '.head.repo.full_name' <<< "$data")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.user.login' <<< "$data")" = 'Conroy1988'
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -f .github/development-packages/issue553_alliance_member_manager_native_render_v8_1_3.py

      - name: Rebase onto current main and apply package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Conroy1988'
          git config user.email '27301455+Conroy1988@users.noreply.github.com'
          git rebase origin/main
          python3 .github/development-packages/issue553_alliance_member_manager_native_render_v8_1_3.py
          rm .github/development-packages/issue553_alliance_member_manager_native_render_v8_1_3.py
          rm .github/workflows/temporary-issue553-v8-1-3-executor.yml
          find .github/development-packages -type d -empty -delete 2>/dev/null || true

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_userscript.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          python3 .github/scripts/test_alliance_member_manager_contract.py
          node .github/scripts/test_issue553_alliance_member_manager_menu_runtime.js
          bash .github/scripts/run_userscript_preflight.sh --all

      - name: Push exact validated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && { echo 'Package produced no changes.' >&2; exit 1; }
          git commit -m 'v8.1.3: Render Alliance Member Manager natively'
          git push --force-with-lease='refs/heads/fix/alliance-member-manager-native-render-v8-1-3:a81c27d7761829ffef0bf395c8183f7ffb155d16' origin HEAD:fix/alliance-member-manager-native-render-v8-1-3

      - name: Record completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 559 --repo "$GITHUB_REPOSITORY" --body "Temporary owner-gated executor completed. The clean v8.1.3 candidate replaced the package head; transport files were removed before validation and push."
