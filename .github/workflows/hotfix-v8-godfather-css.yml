name: Build v8.0.1 Godfather CSS Hotfix

on:
  push:
    branches:
      - hotfix/v8.0.1-godfather-css-activation
    paths:
      - ".github/workflows/hotfix-v8-godfather-css.yml"

permissions:
  contents: write

concurrency:
  group: v8-0-1-godfather-css-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    if: github.actor == 'Conroy1988' && github.ref_name == 'hotfix/v8.0.1-godfather-css-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: hotfix/v8.0.1-godfather-css-activation
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic v8.0.1 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')
          source_paths = [
              root / 'src/MissionChief_Map_Command_Toolkit.user.js',
              root / 'dist/MissionChief_Map_Command_Toolkit.user.js',
              root / 'dist/MissionChief_Map_Command_Toolkit.txt',
          ]
          released_hash = '049a0a0003dc28a1acabbb3a39958c01081deaa4032b48cedae97e9fc90d4d5b'
          hotfix_hash = 'f64d180da6fabbbe775353e914529a7353427f6dafe3ee2da84cc96d5fc6f525'
          payloads = [path.read_text(encoding='utf-8') for path in source_paths]
          if len(set(payloads)) != 1:
              raise SystemExit('Released source and distribution mirrors are not identical')
          if hashlib.sha256(payloads[0].encode()).hexdigest() != released_hash:
              raise SystemExit('Released v8.0.0 source hash does not match the guarded hotfix baseline')

          broken = '''        html[data-mcms-economy="true"] #${SCRIPT.payoutFlashId}[data-template="hyruleQuest"] .mcms-payout-theme-particles {
              animation:none !important;
              display:none !important;
          /* v8.0.0 — The Godfather: complete original old-money command interface. */'''
          repaired = '''        html[data-mcms-economy="true"] #${SCRIPT.payoutFlashId}[data-template="hyruleQuest"] .mcms-payout-theme-particles {
              animation:none !important;
              display:none !important;
          }
          /* v8.0.1 — The Godfather: complete original old-money command interface. */'''
          displaced_close = '''        }
          }html[data-mcms-mobile-active="true"],'''
          restored_boundary = '''        }
          html[data-mcms-mobile-active="true"],'''

          text = payloads[0]
          if text.count(broken) != 1:
              raise SystemExit(f'Expected one malformed Godfather CSS boundary, found {text.count(broken)}')
          if text.count(displaced_close) != 1:
              raise SystemExit(f'Expected one displaced stylesheet closing brace, found {text.count(displaced_close)}')
          text = text.replace(broken, repaired)
          text = text.replace(displaced_close, restored_boundary)
          text = text.replace('// @version      8.0.0', '// @version      8.0.1', 1)
          text = text.replace("version: '8.0.0'", "version: '8.0.1'", 1)
          if hashlib.sha256(text.encode()).hexdigest() != hotfix_hash:
              raise SystemExit('Generated v8.0.1 source hash differs from the reviewed repair')
          for path in source_paths:
              path.write_text(text, encoding='utf-8')

          fixture_path = root / '.github/fixtures/main-style-source-headroom.json'
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          candidate = fixture['v8Candidate']
          candidate.update({
              'issue': 537,
              'version': '8.0.1',
              'sourceBytes': 1600037,
              'sourceLines': 24101,
              'sourceSha256': hotfix_hash,
              'templateBytes': 679322,
              'templateLines': 7770,
              'templateSha256': '0202d83ed6eacf94c7454a290a36d0d473afb69f84d4c5d2f7f9de7b4f3727df',
              'canonicalCssSha256': '02f76d27d1ae1b74dcf515e9d646b438bca2ab492669e386b1e7ec7322d38ffb',
              'approvedGrowth': {
                  'sourceBytes': 35140,
                  'sourceLines': 518,
                  'templateBytes': 32479,
                  'templateLines': 490,
              },
              'scope': 'Issue #537 Godfather stylesheet activation hotfix with balanced top-level CSS boundaries',
          })
          fixture_path.write_text(json.dumps(fixture, indent=2) + '\n', encoding='utf-8')

          contract_path = root / '.github/scripts/test_v8_godfather_contract.py'
          contract = contract_path.read_text(encoding='utf-8')
          contract = contract.replace(released_hash, hotfix_hash)
          contract = contract.replace('8.0.0', '8.0.1')
          contract_path.write_text(contract, encoding='utf-8')

          issue530 = root / '.github/scripts/test_issue530_transport_sweep_discharge_confirmation.py'
          issue530.write_text(issue530.read_text(encoding='utf-8').replace("== '8.0.0'", "== '8.0.1'"), encoding='utf-8')

          manifest_path = root / 'themes/godfather/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['toolkitVersion'] = '8.0.1'
          manifest['notes'] = 'Original Toolkit-made old-money command system. v8.0.1 restores the complete stylesheet activation boundary. No film stills, actor likenesses, studio logos or copied franchise artwork.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          help_manifest_path = root / 'help/manifest.json'
          help_manifest = json.loads(help_manifest_path.read_text(encoding='utf-8'))
          help_manifest['guideVersion'] = '8.0.1'
          help_manifest['toolkitVersion'] = '8.0.1'
          help_manifest['runtimeGuidePatch'] = 'Toolkit v8.0.1 restores the complete Godfather stylesheet boundary and adds a permanent activation regression while retaining the v7 native product boundary.'
          help_manifest_path.write_text(json.dumps(help_manifest, indent=2) + '\n', encoding='utf-8')

          help_path = root / 'help/index.html'
          help_text = help_path.read_text(encoding='utf-8')
          help_text = help_text.replace('v8.0.0', 'v8.0.1')
          help_text = help_text.replace('<h2>What changed in v7.1.6</h2><p>Patient Transport Sweep now confirms the intermittent native Discharge patient dialog by clicking only Yes, discharge! during an armed sweep action. Abort and discharge-and-disable-confirmation remain untouched.</p>', '<h2>What changed in v8.0.1</h2><p>The complete Godfather interface now activates correctly. A displaced CSS closing brace had caused the browser to discard the theme rules while leaving the selection state active. The stylesheet boundary is repaired and permanently validated.</p>')
          help_text = help_text.replace('MissionChief Map Command Toolkit · v7.1.6 candidate', 'MissionChief Map Command Toolkit · v8.0.1 candidate')
          help_path.write_text(help_text, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''## [8.0.1] - 2026-07-26

### Godfather interface activation hotfix

- Closed the Hyrule Economy Mode payout rule before the Godfather stylesheet so browsers parse the complete eighth interface at top level.
- Removed the displaced trailing brace that had silently contained and discarded the Godfather selectors.
- Added a permanent stylesheet-boundary regression that verifies balanced CSS depth at the Godfather and responsive-layout boundaries.
- Preserved all Godfather assets, payout audio, responsive behaviour, existing themes and the v7 native MissionChief boundary.

'''
          if '## [8.0.1]' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          regression = root / '.github/scripts/test_issue537_godfather_css_activation.py'
          regression.write_text('''#!/usr/bin/env python3
          from pathlib import Path
          import hashlib
          import re

          ROOT = Path(__file__).resolve().parents[2]
          SOURCE = ROOT / "src/MissionChief_Map_Command_Toolkit.user.js"
          EXPECTED_HASH = "f64d180da6fabbbe775353e914529a7353427f6dafe3ee2da84cc96d5fc6f525"

          def css_depth(text: str, stop: int) -> int:
              depth = 0
              quote = ""
              escaped = False
              comment = False
              index = 0
              while index < stop:
                  char = text[index]
                  nxt = text[index + 1] if index + 1 < stop else ""
                  if comment:
                      if char == "*" and nxt == "/":
                          comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\\\":
                          escaped = True
                      elif char == quote:
                          quote = ""
                      index += 1
                      continue
                  if char == "/" and nxt == "*":
                      comment = True
                      index += 2
                      continue
                  if char in ("'", '"'):
                      quote = char
                  elif char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      assert depth >= 0, "stylesheet closes below top-level depth"
                  index += 1
              return depth

          source = SOURCE.read_text(encoding="utf-8")
          assert hashlib.sha256(source.encode()).hexdigest() == EXPECTED_HASH
          assert re.search(r"(?m)^//\\s*@version\\s+8\\.0\\.1$", source)
          install = source.index("function installMainStyles()")
          css_start = source.index("addStyle(`", install) + len("addStyle(`")
          css_end_marker = source.index("recordStartupMetric('stylesheetInstallMs'", css_start)
          css_end = source.rfind("`);", css_start, css_end_marker)
          css = source[css_start:css_end]
          godfather = css.index("/* v8.0.1 — The Godfather: complete original old-money command interface. */")
          responsive = css.index('html[data-mcms-mobile-active="true"],', godfather)
          assert css_depth(css, godfather) == 0, "Godfather stylesheet starts inside another CSS rule"
          assert css_depth(css, responsive) == 0, "responsive stylesheet starts inside the Godfather block"
          assert css_depth(css, len(css)) == 0, "main stylesheet has unbalanced rule braces"
          assert 'display:none !important;\n        }\n        /* v8.0.1 — The Godfather' in css
          assert '}html[data-mcms-mobile-active="true"],' not in css
          assert css.count('html[data-mcms-ui-theme="godfather"]') >= 100
          for path in (ROOT / 'dist/MissionChief_Map_Command_Toolkit.user.js', ROOT / 'dist/MissionChief_Map_Command_Toolkit.txt'):
              assert path.read_bytes() == SOURCE.read_bytes(), f"distribution parity failed: {path}"
          print("Issue #537 Godfather stylesheet activation contract passed.")
          ''').replace('          ', ''), encoding='utf-8')

          preflight_path = root / '.github/scripts/run_userscript_preflight.sh'
          preflight = preflight_path.read_text(encoding='utf-8')
          anchor = '.github/scripts/test_issue530_transport_sweep_discharge_confirmation.py'
          if '.github/scripts/test_issue537_godfather_css_activation.py' not in preflight:
              preflight = preflight.replace(anchor, anchor + ' .github/scripts/test_issue537_godfather_css_activation.py')
          preflight_path.write_text(preflight, encoding='utf-8')
          PY

      - name: Remove temporary writer and workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy_path = Path('.github/actions-security-policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          removed = policy['allowedWritePermissions'].pop('.github/workflows/hotfix-v8-godfather-css.yml', None)
          if removed != ['contents']:
              raise SystemExit(f'Unexpected hotfix writer policy: {removed!r}')
          policy_path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')
          Path('.github/workflows/hotfix-v8-godfather-css.yml').unlink()
          PY

      - name: Validate repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          python3 .github/scripts/test_issue537_godfather_css_activation.py
          python3 .github/scripts/test_v8_godfather_contract.py
          python3 .github/scripts/test_main_style_source_headroom.py
          bash .github/scripts/run_userscript_preflight.sh
          python3 .github/scripts/validate_userscript.py
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          test ! -e .github/workflows/hotfix-v8-godfather-css.yml

      - name: Commit exact hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git commit -m "Fix Godfather stylesheet activation for v8.0.1"
          git push origin HEAD:hotfix/v8.0.1-godfather-css-activation
