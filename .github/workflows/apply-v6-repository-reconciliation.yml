name: Apply v6 Repository Reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/v6-reconcile/**"
      - ".github/scripts/test_issue391_matrix_retirement.py"
      - ".github/fixtures/main-style-source-headroom.json"
      - ".github/scripts/test_main_style_source_headroom.py"
      - ".github/fixtures/section-navigation-contract.json"
      - ".github/scripts/test_root_attribute_write_suppression_contract.py"
      - ".github/workflows/apply-v6-repository-reconciliation.yml"

permissions:
  contents: read

concurrency:
  group: toolkit-v6-repository-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor == 'Conroy1988' && github.head_ref == 'feat/issue-510-v6-performance-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact v6 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/issue-510-v6-performance-overhaul
          fetch-depth: 0
          persist-credentials: false

      - name: Apply exact source correction
        run: python3 .github/v6-reconcile/fix_v6_source_regressions.py

      - name: Apply deterministic repository patch
        run: python3 .github/v6-reconcile/patch_v6_repository.py

      - name: Apply final settings-contract cleanup
        run: python3 .github/v6-reconcile/fix_v6_settings_contract.py

      - name: Validate updated settings fixture
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/test_settings_ui_contract.py 2>&1 | tee /tmp/v6-settings-contract.log

      - name: Upload settings-contract diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v6-settings-contract-diagnostic-${{ github.sha }}
          path: /tmp/v6-settings-contract.log
          if-no-files-found: warn
          retention-days: 7

      - name: Apply boot fixture cleanup
        run: python3 .github/v6-reconcile/fix_v6_boot_contract.py

      - name: Validate updated boot lifecycle fixture
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/test_boot_lifecycle_contract.py 2>&1 | tee /tmp/v6-boot-contract.log

      - name: Upload boot-contract diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v6-boot-contract-diagnostic-${{ github.sha }}
          path: /tmp/v6-boot-contract.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate v6 candidate documentation
        run: python3 .github/scripts/check_documentation_drift.py --allow-release-candidate

      - name: Build and validate v6 candidate distribution
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/validate_userscript.py 2>&1 | tee /tmp/v6-candidate-builder.log

      - name: Upload candidate-builder diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v6-candidate-builder-diagnostic-${{ github.sha }}
          path: /tmp/v6-candidate-builder.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify candidate syntax and parity
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent src/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt

      - name: Commit reconciled candidate files to exact review branch
        env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_PR_TOKEN"
          test "$GITHUB_HEAD_REF" = "feat/issue-510-v6-performance-overhaul"
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -- \
            src/MissionChief_Map_Command_Toolkit.user.js \
            CHANGELOG.md README.md help/index.html docs/site-data.json \
            docs/greasyfork-description.md docs/media/readme-hero.svg \
            docs/audits/v6-critical-performance-baseline.md \
            docs/audits/v6-critical-performance-evidence.json \
            .github/documentation-contract.json \
            .github/fixtures/settings-ui-contract.json \
            .github/fixtures/boot-lifecycle-contract.json \
            .github/scripts/test_settings_ui_contract.py \
            dist/MissionChief_Map_Command_Toolkit.user.js \
            dist/MissionChief_Map_Command_Toolkit.txt \
            dist/SHA256SUMS.txt dist/release-manifest.json
          git diff --cached --quiet && { echo "::error::No v6 reconciliation change was produced."; exit 1; }
          git commit -m "Reconcile v6.0.0 candidate documentation and distribution"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/feat/issue-510-v6-performance-overhaul
