<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MissionChief Toolkit Emergency Systems Board</title>
<desc id="desc">Verified v7.1.4 native command divisions for incident, mission, fleet, map, finance and transport systems.</desc>
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26343e"/><stop offset=".25" stop-color="#0b1217"/><stop offset=".72" stop-color="#131d24"/><stop offset="1" stop-color="#04070a"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".095"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".75"/></filter>
</defs>
<image href="readme-command-board-cinematic-base.svg" x="0" y="0" width="1600" height="900"/>
<!-- Production badge -->
<g filter="url(#shadow)">
  <path d="M395 27h235l10 10v45l-10 10H395l-10-10V37z" fill="url(#steel)" stroke="#168ddd" stroke-width="2"/>
  <circle cx="421" cy="59" r="11" fill="#159eff"/>
  <path d="m415 59 5 5 9-12" fill="none" stroke="#031019" stroke-width="4"/>
  <text x="448" y="67" fill="#e5f7ff" font-family="Arial Narrow,Arial,sans-serif" font-size="19" font-weight="900" letter-spacing="2.2">VERIFIED v7.1.4</text>
</g>
<!-- Board identity line -->
<rect x="55" y="88" width="795" height="31" rx="4" fill="#050a0e" fill-opacity=".96"/>
<text x="72" y="109" fill="#8ea1ab" font-family="Courier New,monospace" font-size="14" font-weight="700">MISSIONCHIEF MAP COMMAND TOOLKIT // VERIFIED v7.1.4 // CALLSIGN MC-UK</text>
<!-- Current-release panel -->
<g filter="url(#shadow)">
  <rect x="72" y="164" width="342" height="78" rx="16" fill="url(#glass)" stroke="#27b7ff" stroke-opacity=".55"/>
  <text x="96" y="193" fill="#8be1ff" font-family="Courier New,monospace" font-size="11" font-weight="900" letter-spacing="1.7">CURRENT RELEASE</text>
  <text x="96" y="224" fill="#fff" font-family="Arial Narrow,Arial,sans-serif" font-size="27" font-weight="900">v7.1.4</text>
</g>
</svg>