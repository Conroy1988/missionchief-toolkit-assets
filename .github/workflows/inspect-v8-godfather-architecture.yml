name: Build v8 Godfather Interface

on:
  push:
    branches:
      - feat/v8-godfather-an-offer-he-cant-refuse
    paths:
      - ".github/v8-godfather/builder-parts/**"
      - ".github/workflows/inspect-v8-godfather-architecture.yml"

permissions:
  contents: write

concurrency:
  group: v8-godfather-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'Conroy1988' && github.ref_name == 'feat/v8-godfather-an-offer-he-cant-refuse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact development branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/v8-godfather-an-offer-he-cant-refuse
          fetch-depth: 0
          persist-credentials: true

      - name: Verify isolated branch context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/v8-godfather-an-offer-he-cant-refuse"
          test "$(git remote get-url origin)" = "https://github.com/Conroy1988/missionchief-toolkit-assets"
          git diff --quiet
          git diff --cached --quiet

      - name: Reconstruct deterministic clean-room builder
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v8-godfather/builder-parts/part-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/build_v8_godfather.py
          python3 -m py_compile /tmp/build_v8_godfather.py
          test "$(wc -c < /tmp/build_v8_godfather.py)" -ge 50000

      - name: Build and self-clean v8 interface
        run: python3 /tmp/build_v8_godfather.py --root . --clean-staging

      - name: Validate generated JavaScript and theme package
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          python3 .github/scripts/test_v8_godfather_contract.py
          python3 -m json.tool themes/godfather/manifest.json >/dev/null
          python3 -m json.tool docs/site-data.json >/dev/null
          python3 -m json.tool help/manifest.json >/dev/null
          python3 -m json.tool status/theme-asset-inventory.json >/dev/null
          python3 -m json.tool status/media-asset-audit.json >/dev/null

      - name: Run canonical userscript preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_userscript.py
          git restore --worktree --staged -- dist
          git clean -fd -- dist

      - name: Verify staging teardown and intended scope
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/v8-godfather
          test ! -e .github/workflows/inspect-v8-godfather-architecture.yml
          git status --short
          test -n "$(git status --porcelain)"

      - name: Commit exact generated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes found"
            exit 1
          fi
          git commit -m "Implement v8.0.0 Godfather interface"
          git push origin HEAD:feat/v8-godfather-an-offer-he-cant-refuse
