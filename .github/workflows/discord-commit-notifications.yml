name: Discord Development Updates

run-name: Development commits · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "release/**"
      - "trigger/**"
      - "diagnostics/**"
      - "chore/**"

permissions:
  contents: write

concurrency:
  group: discord-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    name: Post development update
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Build and post Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMITS_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          COMPARE_URL: ${{ github.event.compare }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.actor }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "::error::DISCORD_COMMITS_WEBHOOK is not configured."
            exit 1
          fi

          COMMIT_COUNT="$(jq 'length' <<< "$COMMITS_JSON")"
          SHORT_SHA="${AFTER_SHA:0:7}"

          COMMIT_LINES="$(
            jq -r '
              .[:10]
              | map("[`" + (.id[0:7]) + "`](${{ github.server_url }}/${{ github.repository }}/commit/" + .id + ") " + ((.message | split("\n")[0])[:120]))
              | join("\n")
            ' <<< "$COMMITS_JSON"
          )"

          if [[ "$COMMIT_COUNT" -gt 10 ]]; then
            COMMIT_LINES+=$'\n'"…and $((COMMIT_COUNT - 10)) more commit(s)."
          fi

          if [[ -z "$COMMIT_LINES" ]]; then
            COMMIT_LINES="No commit summary was supplied by GitHub."
          fi

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg repository_url "$REPOSITORY_URL" \
            --arg compare_url "$COMPARE_URL" \
            --arg branch "$BRANCH" \
            --arg pusher "$PUSHER" \
            --arg short_sha "$SHORT_SHA" \
            --arg commit_count "$COMMIT_COUNT" \
            --arg commit_lines "$COMMIT_LINES" \
            '{
              username: "MissionChief Toolkit Development",
              allowed_mentions: { parse: [] },
              embeds: [
                {
                  title: ("Development update · " + $short_sha),
                  url: $compare_url,
                  description: $commit_lines,
                  color: 5793266,
                  fields: [
                    { name: "Repository", value: ("[" + $repository + "](" + $repository_url + ")"), inline: true },
                    { name: "Branch", value: ("`" + $branch + "`"), inline: true },
                    { name: "Pushed by", value: ("`" + $pusher + "`"), inline: true },
                    { name: "Commits", value: $commit_count, inline: true }
                  ],
                  footer: { text: "MissionChief Map Command Toolkit · Development" }
                }
              ]
            }' > discord-development-payload.json

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --data @discord-development-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true"

          echo
          echo "Development notification posted to Discord."

  apply-reviewed-alliance-member-manager:
    name: Apply reviewed v8.1.0 package
    if: >-
      github.ref_name == 'feature/alliance-member-manager' &&
      contains(github.event.head_commit.message, '[execute reviewed package]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feature/alliance-member-manager
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/alliance-member-manager"
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD
          test -f .github/development-packages/v8_1_alliance_member_manager.py

      - name: Apply reviewed package
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/development-packages/v8_1_alliance_member_manager.py
          rm .github/development-packages/v8_1_alliance_member_manager.py

      - name: Validate release-ready candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_userscript.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt
          python3 .github/scripts/test_alliance_member_manager_contract.py

      - name: Publish validated product changes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No package changes were produced." >&2; exit 1; }
          git commit -m "Implement v8.1.0 Alliance Member Manager"
          git push origin HEAD:feature/alliance-member-manager
