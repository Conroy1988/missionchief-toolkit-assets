name: Temporary Issue 565 v8.2.3 Executor

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-issue565-v8-2-3
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'Conroy1988/missionchief-toolkit-assets' &&
      github.event.pull_request.number == 572 &&
      github.event.pull_request.head.ref == 'fix/transport-sweep-async-candidate-v8-2-3'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require owner branch token
        env:
          OWNER_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OWNER_TOKEN" ]] || { echo 'DEVELOPMENT_PR_TOKEN is required.' >&2; exit 1; }

      - name: Check out exact pull-request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.DEVELOPMENT_PR_TOKEN }}

      - name: Apply, validate, clean and publish
        env:
          EXPECTED_MAIN: d82c361aa82064244d1b59f3899d7c83f102e870
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: fix/transport-sweep-async-candidate-v8-2-3
          PACKAGE: .github/development-packages/issue565_transport_sweep_async_candidate_v8_2_3.py
          EXECUTOR: .github/workflows/temporary-issue565-v8-2-3-executor.yml
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/issue565-v823.log") 2>&1
          echo stage=verify-carrier
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -f "$PACKAGE"
          test -f "$EXECUTOR"

          echo stage=apply-package
          python3 "$PACKAGE"

          echo stage=install-browser-runtime
          npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0

          echo stage=targeted-regression
          python3 .github/scripts/test_issue565_transport_sweep_no_reward.py
          node .github/scripts/test_issue565_transport_sweep_no_reward_runtime.mjs

          echo stage=canonical-validation
          python3 .github/scripts/validate_userscript.py
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent src/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent src/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt

          echo stage=performance-budget
          git show "$EXPECTED_MAIN:src/MissionChief_Map_Command_Toolkit.user.js" > /tmp/performance-base.user.js
          python3 .github/scripts/check_performance_budget.py \
            --candidate src/MissionChief_Map_Command_Toolkit.user.js \
            --base /tmp/performance-base.user.js \
            --policy .github/performance-budget.json \
            --json-output /tmp/performance-budget-report.json \
            --markdown-output /tmp/performance-budget-report.md

          echo stage=full-preflight
          bash .github/scripts/run_userscript_preflight.sh --all

          echo stage=clean-carrier
          rm -rf node_modules
          rm -f "$PACKAGE" "$EXECUTOR"
          find .github/development-packages -type d -empty -delete 2>/dev/null || true
          test -z "$(git ls-files node_modules)"

          echo stage=publish-candidate
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No candidate changes produced.' >&2; exit 1; }
          git commit -m "v8.2.3: Fix no-reward release eligibility"
          git push --force-with-lease="refs/heads/${BRANCH}:${EXPECTED_HEAD}" origin "HEAD:${BRANCH}"

      - name: Upload executor diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue565-v8-2-3-executor-${{ github.sha }}
          path: ${{ runner.temp }}/issue565-v823.log
          if-no-files-found: warn
          retention-days: 30
