name: Apply v7 Complete Imported-System Retirement

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/v7-retirement/apply_v7_retirement.py"
      - ".github/workflows/apply-v7-retirement.yml"

permissions:
  contents: read

concurrency:
  group: toolkit-v7-retirement
  cancel-in-progress: false

jobs:
  retire:
    name: Build and validate v7 native Toolkit candidate
    if: github.actor == 'Conroy1988' && github.head_ref == 'fix/issue-512-lssm-coexistence'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact v7 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/issue-512-lssm-coexistence
          fetch-depth: 0
          persist-credentials: false

      - name: Apply complete v7 retirement and validate candidate
        shell: bash
        run: |
          set +e
          python3 .github/v7-retirement/apply_v7_retirement.py > v7-retirement.log 2>&1
          status=$?
          tail -n 220 v7-retirement.log
          exit "$status"

      - name: Commit exact v7 candidate
        env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_PR_TOKEN"
          test "$GITHUB_HEAD_REF" = "fix/issue-512-lssm-coexistence"
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No v7 retirement changes produced."; exit 1; }
          git commit -m "Build v7.0.0 The One We Knew Before"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/fix/issue-512-lssm-coexistence
