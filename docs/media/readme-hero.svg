<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="810" viewBox="0 0 1800 810" role="img" aria-labelledby="title desc">
<title id="title">MissionChief Map Command Toolkit cinematic emergency command console</title>
<desc id="desc">Cinematic UK emergency command console with live dispatch, mission, fleet, map and finance control for verified Toolkit v7.1.4.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020508"/><stop offset=".46" stop-color="#07131d"/><stop offset="1" stop-color="#13070a"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#27323a"/><stop offset=".18" stop-color="#10171c"/><stop offset=".82" stop-color="#070b0e"/><stop offset="1" stop-color="#202a31"/></linearGradient>
<linearGradient id="titleGold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe79d"/><stop offset=".48" stop-color="#f0b83f"/><stop offset="1" stop-color="#9b5c08"/></linearGradient>
<linearGradient id="whiteSteel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#d7d9d8"/><stop offset="1" stop-color="#82898c"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e4167"/><stop offset="1" stop-color="#06121c"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174625"/><stop offset="1" stop-color="#07140b"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#50370b"/><stop offset="1" stop-color="#171006"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51171d"/><stop offset="1" stop-color="#19080a"/></linearGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#78d8ff" stroke-opacity=".045"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#fff" opacity=".018"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".7"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="textShadow"><feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".9"/></filter>
</defs>
