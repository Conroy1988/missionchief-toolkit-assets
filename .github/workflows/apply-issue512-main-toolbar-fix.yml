name: Apply Issue 512 Main Toolbar Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/issue512/apply_main_toolbar_fix.py"
      - ".github/workflows/apply-issue512-main-toolbar-fix.yml"

permissions:
  contents: read

concurrency:
  group: toolkit-issue512-main-toolbar-fix
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate bounded Main Toolbar bootstrap
    if: github.actor == 'Conroy1988' && github.head_ref == 'fix/issue-512-lssm-coexistence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact emergency branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/issue-512-lssm-coexistence
          fetch-depth: 0
          persist-credentials: false

      - name: Apply Main Toolbar bootstrap correction
        run: python3 .github/issue512/apply_main_toolbar_fix.py

      - name: Validate exact Main Toolbar contract
        run: python3 .github/scripts/test_issue512_main_toolbar_bootstrap_contract.py

      - name: Build and validate complete candidate
        run: python3 .github/scripts/validate_userscript.py

      - name: Run deterministic preflight
        run: bash .github/scripts/run_userscript_preflight.sh --contracts

      - name: Verify syntax and distribution parity
        shell: bash
        run: |
          set -euo pipefail
          node --check src/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent src/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.user.js
          cmp --silent dist/MissionChief_Map_Command_Toolkit.user.js dist/MissionChief_Map_Command_Toolkit.txt

      - name: Remove one-use diagnostics and builder
        run: |
          rm -f .github/scripts/diagnose_issue512_lssm_coexistence.py
          rm -f .github/workflows/issue512-lssm-coexistence-diagnostic.yml
          rm -f .github/issue512/apply_main_toolbar_fix.py
          rm -f .github/workflows/apply-issue512-main-toolbar-fix.yml
          rmdir .github/issue512 2>/dev/null || true

      - name: Commit exact emergency candidate
        env:
          DEVELOPMENT_PR_TOKEN: ${{ secrets.DEVELOPMENT_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_PR_TOKEN"
          test "$GITHUB_HEAD_REF" = "fix/issue-512-lssm-coexistence"
          git config user.name "Conroy1988"
          git config user.email "27301455+Conroy1988@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No Issue #512 changes were produced."; exit 1; }
          git commit -m "Fix Main Toolbar mutation storm and integrity loop"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$DEVELOPMENT_PR_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin HEAD:refs/heads/fix/issue-512-lssm-coexistence
